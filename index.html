<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট ক্যালেন্ডার প্রো</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .header-gradient { background: linear-gradient(135deg, #10b981, #059669); border-radius: 0 0 25px 25px; }
        .calendar-card { background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .admin-box { background: #1e293b; border-radius: 20px; color: #fbbf24; }
        .day-cell { border: 1px solid #f1f5f9; border-radius: 12px; transition: 0.2s; min-height: 70px; }
        .today-mark { border: 2px solid #3b82f6; background-color: #eff6ff; }
        .bn-num { font-size: 1.3rem; font-weight: 700; color: #334155; }
    </style>
</head>
<body class="pb-10">

    <div class="header-gradient p-6 text-white shadow-lg mb-6">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">স্মার্ট ক্যালেন্ডার</h1>
                <p id="topDate" class="text-sm opacity-90"></p>
            </div>
            <div class="bg-white/20 backdrop-blur-md p-3 rounded-2xl text-center">
                <div id="clock" class="text-xl font-bold tracking-tighter">০০:০০:০০</div>
                <div class="text-[10px] uppercase opacity-80">বাংলাদেশ সময়</div>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 space-y-6">

        <div id="adminPanel" class="hidden admin-box p-5 shadow-xl border border-slate-700">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg">হিজরি সমন্বয়</h3>
                    <p class="text-xs text-gray-400">এডমিন কন্ট্রোল প্যানেল</p>
                </div>
                <div class="flex items-center gap-3 bg-slate-800 p-2 rounded-full px-4 border border-slate-600">
                    <button onclick="changeHijri(-1)" class="w-8 h-8 bg-red-500 text-white rounded-full font-bold shadow-md">-</button>
                    <span id="adjDisplay" class="text-xl font-bold w-6 text-center text-white">০</span>
                    <button onclick="changeHijri(1)" class="w-8 h-8 bg-green-500 text-white rounded-full font-bold shadow-md">+</button>
                </div>
            </div>
        </div>

        <div class="calendar-card p-6 border border-gray-100">
            <div class="flex justify-between items-center mb-6">
                <button class="text-gray-300 hover:text-gray-600 text-2xl">❮</button>
                <h2 id="monthLabel" class="text-xl font-bold text-slate-700">মে ২০২৬</h2>
                <button class="text-gray-300 hover:text-gray-600 text-2xl">❯</button>
            </div>
            
            <div class="grid grid-cols-7 gap-1 text-center font-bold text-gray-400 text-xs mb-3">
                <div>শনি</div><div>রবি</div><div>সোম</div><div>মঙ্গল</div><div>বুধ</div><div>বৃহ</div><div class="text-red-400">শুক্র</div>
            </div>

            <div id="calGrid" class="grid grid-cols-7 gap-2"></div>
        </div>
    </div>

    <script>
        // আপনার Firebase কনফিগ এখানে দিন
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const toBn = n => n.toString().replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
        let hAdjustment = 0;

        // এডমিন চেক
        firebase.auth().onAuthStateChanged(user => {
            if (user && user.email === 'admin@gmail.com') {
                document.getElementById('adminPanel').classList.remove('hidden');
            }
        });

        // হিজরি আপডেট শোনা
        db.collection('settings').doc('hijri').onSnapshot(doc => {
            if (doc.exists) {
                hAdjustment = doc.data().value || 0;
                document.getElementById('adjDisplay').innerText = toBn(hAdjustment);
                render();
            }
        });

        function changeHijri(v) {
            db.collection('settings').doc('hijri').set({ value: hAdjustment + v });
        }

        function render() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            const days = 31; // মে মাস
            const start = 6; // শনিবার থেকে শুরু

            for(let i=0; i<start; i++) grid.innerHTML += '<div></div>';

            for(let d=1; d<=days; d++) {
                const isToday = (d === 3); // আজকের দিন ৩ মে
                const arb = d + 16 + hAdjustment;

                grid.innerHTML += `
                    <div class="day-cell p-2 text-center flex flex-col justify-between ${isToday ? 'today-mark' : 'bg-white'}">
                        <div class="bn-num">${toBn(d)}</div>
                        <div class="flex flex-col text-[10px] leading-tight">
                            <span class="text-emerald-600 font-bold">বৈশাখ</span>
                            <span class="text-amber-600 font-bold">${toBn(arb)}</span>
                        </div>
                    </div>
                `;
            }
        }

        // ঘড়ি ও তারিখ আপডেট
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('bn-BD', {hour12: false});
            document.getElementById('topDate').innerText = now.toLocaleDateString('bn-BD', {weekday: 'long', day: 'numeric', month: 'long'});
        }, 1000);

        render();
    </script>
</body>
</html>
