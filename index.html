<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট ক্যালেন্ডার ২০২৬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #014732; font-family: 'Arial', sans-serif; padding: 5px; }
        .calendar-card { max-width: 450px; margin: auto; background: white; border-radius: 15px; overflow: hidden; border: 3px solid #014732; }
        .month-header { text-align: center; padding: 15px; color: #014732; font-size: 28px; font-weight: bold; border-bottom: 2px solid #014732; }
        .info-bar-bng { background: #fff59d; color: #5d4037; text-align: center; font-weight: bold; padding: 5px; border-bottom: 2px solid #014732; }
        .info-bar-arb { background: #80deea; color: #006064; text-align: center; font-weight: bold; padding: 5px; border-bottom: 2px solid #014732; }
        .weekday-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #014732; color: white; text-align: center; font-weight: bold; padding: 10px 0; }
        .grid-container { display: grid; grid-template-columns: repeat(7, 1fr); background: #014732; gap: 2px; border: 1px solid #014732; }
        .day-cell { background: white; min-height: 85px; display: flex; flex-direction: column; justify-content: space-between; padding: 2px; position: relative; border: 1px solid #ddd; }
        .eng-num { font-size: 22px; font-weight: bold; text-align: center; color: #333; margin-top: 5px; }
        .footer-dates { display: flex; justify-content: space-between; padding: 2px; }
        .arb-box { background: #fff3e0; color: #e65100; font-size: 11px; font-weight: bold; padding: 0 4px; border-radius: 3px; border: 1px solid #ffccbc; }
        .bng-box { background: #e1f5fe; color: #01579b; font-size: 11px; font-weight: bold; padding: 0 4px; border-radius: 3px; border: 1px solid #b3e5fc; }
        .holiday { background: #ffcdd2; }
        .today { background: #42a5f5 !important; color: white !important; }
        .today .eng-num { color: white; }
        .friday-col { color: #ff5252; }
    </style>
</head>
<body>

<div class="calendar-card shadow-2xl">
    <div class="month-header">মে ২০২৬</div>
    <div class="info-bar-bng">বৈশাখ -- জ্যৈষ্ঠ ১৪৩৩ বাংলা</div>
    <div class="info-bar-arb">জিলকদ -- জিলহজ্জ ১৪৪৭ হিজরি</div>

    <div class="weekday-header">
        <div>রবি</div><div>সোম</div><div>মঙ্গল</div><div>বুধ</div><div>বৃহঃ</div><div class="friday-col">শুক্র</div><div class="friday-col">শনি</div>
    </div>

    <div id="calendarGrid" class="grid-container">
        </div>
</div>

<script>
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const daysInMonth = 31;
        const firstDay = 5; // ২০২৬ সালের মে মাস শুক্রবার থেকে শুরু
        
        grid.innerHTML = '';

        // প্রথম মাসের শুরুর খালি ঘর
        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += '<div class="day-cell bg-gray-100"></div>';
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const dayOfWeek = (d + firstDay - 1) % 7;
            const isToday = (d === 3); // উদাহরণ হিসেবে ৩ তারিখকে নীল করা হয়েছে
            const isHoliday = (dayOfWeek === 5 || dayOfWeek === 6 || d >= 26); // শুক্র, শনি ও শেষের দিনগুলো লালচে

            // আরবি ও বাংলা তারিখের একটি সাধারণ হিসাব (আপনার ছবি অনুযায়ী)
            let arbDate = (d + 16) % 30 || 30;
            let bngDate = (d + 17) % 30 || 30;

            grid.innerHTML += `
                <div class="day-cell ${isHoliday ? 'holiday' : ''} ${isToday ? 'today' : ''}">
                    <div class="eng-num">${d}</div>
                    <div class="footer-dates">
                        <span class="arb-box">${arbDate}</span>
                        <span class="bng-box">${bngDate}</span>
                    </div>
                </div>
            `;
        }
    }
    renderCalendar();
</script>

</body>
</html>
