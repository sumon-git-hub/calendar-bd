<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাই স্মার্ট ক্যালেন্ডার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .main-container { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; }
        .header-green { background-color: #059669; padding: 25px 20px; text-align: center; color: white; border-radius: 0 0 30px 30px; }
        .clock-pill { background: rgba(0,0,0,0.15); display: inline-block; padding: 8px 30px; border-radius: 50px; font-size: 24px; font-weight: bold; margin-top: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .diamond { color: #d97706; font-size: 1.2rem; }
        .date-row { font-size: 19px; font-weight: 600; color: #334155; margin: 8px 0; }
        .month-header { font-size: 30px; font-weight: 800; color: #1e293b; text-align: center; margin-top: 20px; }
        .labels-flex { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #64748b; border-bottom: 1px solid #e2e8f0; padding: 8px 0; margin-bottom: 15px; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-label { text-align: center; font-weight: bold; font-size: 14px; color: #94a3b8; padding-bottom: 10px; }
        .cell { height: 65px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f1f5f9; border-radius: 12px; }
        .num-main { font-size: 19px; font-weight: bold; color: #1e293b; }
        .num-sub { font-size: 10px; color: #64748b; font-weight: 600; margin-top: 2px; }
        .active-blue { background: #3b82f6 !important; color: white !important; }
        .active-blue * { color: white !important; }
        .red-text { color: #ef4444 !important; }
    </style>
</head>
<body>

    <div class="main-container shadow-2xl">
        <div class="header-green">
            <h1 class="text-xl font-bold tracking-widest">// মাই স্মার্ট ক্যালেন্ডার //</h1>
            <div id="clock" class="clock-pill">০০:০০:০০ AM</div>
        </div>

        <div class="p-6 text-center border-b">
            <h2 class="text-2xl font-bold text-emerald-800 mb-3">আজ রবিবার</h2>
            <div class="date-row"><span class="diamond">♢</span> ০৩ মে ২০২৬ খ্রিষ্টাব্দ</div>
            <div id="hijriToday" class="date-row"><span class="diamond">♢</span> ১৪ যিলক্বদ ১৪৪৭ হিজরি</div>
            <div class="date-row"><span class="diamond">♢</span> ২০ বৈশাখ ১৪৩৩ বঙ্গাব্দ</div>
        </div>

        <div class="p-5">
            <div class="month-header">MAY 2026</div>
            <div class="labels-flex px-1">
                <span>যিলকদ - যিলহজ্ব</span>
                <span>বৈশাখ - জ্যৈষ্ঠ</span>
            </div>

            <div class="grid-7 mb-2">
                <div class="day-label">শনি</div><div class="day-label">রবি</div><div class="day-label">সোম</div>
                <div class="day-label">মঙ্গল</div><div class="day-label">বুধ</div><div class="day-label">বৃহ</div>
                <div class="day-label red-text">শুক্র</div>
            </div>

            <div id="calendarBody" class="grid-7">
                </div>
        </div>
    </div>

    <script>
        const toBn = n => n.toString().replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
        let hijriAdj = 0; // এটি ডাটাবেস থেকে আপডেট হবে

        function renderCalendar() {
            const body = document.getElementById('calendarBody');
            body.innerHTML = '';
            
            const totalDays = 31; 
            const startEmptyCells = 6; // মে ২০২৬ শুরু শনিবার (৬ষ্ঠ দিন যদি গ্রিড শুরু হয় শনি থেকে)

            // খালি ঘর
            for(let i=0; i<startEmptyCells; i++) {
                body.innerHTML += '<div></div>';
            }

            // তারিখ জেনারেশন
            for(let d=1; d<=totalDays; d++) {
                const isToday = (d === 3);
                const isFri = ((d + startEmptyCells) % 7 === 0);
                
                // হিজরি ও বাংলা তারিখের সাধারণ হিসাব
                const hDate = d + 13 + hijriAdj; 
                const bDate = (d + 17) > 31 ? (d + 17 - 31) : (d + 17);

                body.innerHTML += `
                    <div class="cell ${isToday ? 'active-blue' : ''}">
                        <div class="num-main ${isFri && !isToday ? 'red-text' : ''}">${toBn(d)}</div>
                        <div class="num-sub">${toBn(hDate)}/${toBn(bDate)}</div>
                    </div>
                `;
                
                if(isToday) {
                    document.getElementById('hijriToday').innerHTML = `<span class="diamond">♢</span> ${toBn(hDate)} যিলক্বদ ১৪৪৭ হিজরি`;
                }
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('bn-BD', { hour12: true });
        }

        setInterval(updateTime => {
            updateClock();
        }, 1000);

        updateClock();
        renderCalendar();
    </script>
</body>
</html>
