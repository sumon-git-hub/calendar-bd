<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .header { background: #059669; color: white; padding: 25px; text-align: center; border-radius: 0 0 20px 20px; }
        .day-cell { height: 70px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #f1f5f9; border-radius: 10px; }
        .today { background: #2563eb !important; color: white !important; }
        .friday { color: #ef4444; }
        .eng-num { font-family: 'Poppins', sans-serif; }
        .admin-panel { display: none; background: #1e293b; color: white; padding: 15px; margin: 10px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="main-card shadow-2xl">
    <div class="header">
        <div class="flex justify-between items-center mb-4">
            <div class="w-6"></div>
            <h1 class="text-xl font-bold">My Smart Calendar</h1>
            <button onclick="toggleAdmin()" class="text-xl">⋮</button>
        </div>
        <div id="clock" class="text-3xl font-bold eng-num">00:00:00</div>
    </div>

    <div id="adminPanel" class="admin-panel text-center">
        <p class="text-xs mb-2">চাঁদ অনুযায়ী তারিখ সমন্বয় করুন</p>
        <div class="flex justify-center items-center gap-4">
            <button onclick="changeOffset(-1)" class="bg-red-500 px-4 py-1 rounded">- ১ দিন</button>
            <span id="offsetVal" class="font-bold eng-num">0</span>
            <button onclick="changeOffset(1)" class="bg-blue-500 px-4 py-1 rounded">+ ১ দিন</button>
        </div>
    </div>

    <div class="p-5 text-center">
        <h2 id="topDay" class="text-2xl font-bold text-emerald-700">সোম</h2>
        <p id="topDate" class="text-gray-500 font-semibold"></p>
        <div id="topExtra" class="mt-2 space-y-1">
            <p id="topHijri" class="text-emerald-600 font-bold"></p>
            <p id="topBangla" class="text-orange-600 font-bold"></p>
        </div>
    </div>

    <div class="flex justify-between px-6 mb-4">
        <button onclick="moveMonth(-1)" class="font-bold">❮</button>
        <div id="monthLabel" class="text-lg font-bold eng-num"></div>
        <button onclick="moveMonth(1)" class="font-bold">❯</button>
    </div>

    <div class="grid grid-cols-7 gap-1 px-2 text-center text-[10px] font-bold text-gray-400 mb-2">
        <div>SAT</div><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div class="text-red-500">FRI</div>
    </div>
    <div id="calendarGrid" class="grid grid-cols-7 gap-1 px-2 pb-10"></div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = { databaseURL: "YOUR_FIREBASE_URL" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let offset = 0;
    let curYear = new Date().getFullYear();
    let curMonth = new Date().getMonth();

    // ডাটাবেস থেকে অফসেট পড়া
    db.ref('hOffset').on('value', (s) => {
        offset = s.val() || 0;
        document.getElementById('offsetVal').innerText = offset;
        render();
    });

    function changeOffset(v) {
        offset += v;
        db.ref('hOffset').set(offset);
    }

    function toggleAdmin() {
        const p = document.getElementById('adminPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    const hMonths = ["মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল", "যিলক্বদ", "যিলহজ্ব"];
    const bMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
    const eMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const daysBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function render() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const today = new Date();
        document.getElementById('monthLabel').innerText = eMonths[curMonth] + " " + curYear;

        const firstDay = new Date(curYear, curMonth, 1).getDay();
        const start = (firstDay + 1) % 7;
        const totalDays = new Date(curYear, curMonth + 1, 0).getDate();

        for(let i=0; i<start; i++) grid.innerHTML += '<div></div>';

        for(let d=1; d<=totalDays; d++) {
            const date = new Date(curYear, curMonth, d);
            const isToday = date.toDateString() === today.toDateString();

            // হিজরি লজিক: অফসেট যোগ করে
            let hTime = date.getTime() + (offset * 24 * 60 * 60 * 1000);
            let hDateObj = new Date(hTime);
            
            // একটি বেস তারিখ থেকে হিসাব (সহজ করার জন্য)
            let diff = Math.floor((hDateObj - new Date(2024, 6, 7)) / 86400000);
            let hDay = (diff % 30 + 30) % 30 || 30;
            let hM = (Math.floor(diff / 29.5) % 12 + 12) % 12;

            // বাংলা তারিখ
            let bDiff = Math.floor((date - new Date(2024, 3, 14)) / 86400000) + 1;
            let bDay = (bDiff % 30 + 30) % 30 || 30; // সাধারণ হিসাব

            grid.innerHTML += `
                <div class="day-cell ${isToday ? 'today' : ''}">
                    <span class="font-bold eng-num">${d}</span>
                    <span class="text-[9px] opacity-70">${hDay}/${bDay}</span>
                </div>
            `;

            if(isToday) {
                document.getElementById('topDay').innerText = "আজ " + daysBn[date.getDay()];
                document.getElementById('topDate').innerText = d + " " + eMonths[curMonth] + " " + curYear;
                document.getElementById('topHijri').innerText = hDay + " " + hMonths[hM] + " ১৪৪৬ হিজরি";
                document.getElementById('topBangla').innerText = bDay + " " + bMonths[0] + " ১৪৩১ বঙ্গাব্দ";
            }
        }
    }

    function moveMonth(v) { curMonth += v; if(curMonth>11){curMonth=0;curYear++} if(curMonth<0){curMonth=11;curYear--} render(); }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US'); }, 1000);
</script>
</body>
</html>
