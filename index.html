<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySmartCalendar</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; text-decoration: underline; }
        .date-box { margin: 15px 0; padding: 10px; border-radius: 10px; }
        .label { font-size: 12px; color: #888; display: block; margin-bottom: 5px; }
        .value { font-size: 20px; font-weight: bold; }
        .en { color: #2980b9; }
        .bn { color: #27ae60; }
        .ar { color: #c0392b; }
        
        /* Admin Button & Panel */
        #admin-btn { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #ccc; cursor: pointer; border: none; background: none; }
        #admin-panel { display: none; background: #fff9c4; padding: 10px; border-radius: 8px; margin-top: 15px; border: 1px solid #fbc02d; }
        input { width: 50px; text-align: center; }
        button.save { background: #2c3e50; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h1>MySmartCalendar</h1>
    
    <div class="date-box">
        <span class="label">ইংরেজি তারিখ</span>
        <div id="en" class="value en">...</div>
    </div>

    <div class="date-box">
        <span class="label">বাংলা তারিখ</span>
        <div id="bn" class="value bn">...</div>
    </div>

    <div class="date-box">
        <span class="label">আরবি তারিখ</span>
        <div id="ar" class="value ar">...</div>
    </div>

    <button id="admin-btn" onclick="document.getElementById('admin-panel').style.display='block'">Admin</button>
    
    <div id="admin-panel">
        <label style="font-size: 12px;">আরবি তারিখ কমান/বাড়ান:</label><br>
        <input type="number" id="adj" value="0">
        <button class="save" onclick="saveAdj()">Save</button>
    </div>
</div>

<script>
    let adjustment = parseInt(localStorage.getItem('arAdj')) || 0;

    function render() {
        const now = new Date();

        // ১. ইংরেজি
        document.getElementById('en').innerText = now.toLocaleDateString('bn-BD', {day:'numeric', month:'long', year:'numeric'});

        // ২. আরবি (অ্যাডজাস্টমেন্ট সহ)
        const arDate = new Date();
        arDate.setDate(now.getDate() + adjustment);
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('ar').innerText = new Intl.DateTimeFormat('bn-BD-u-ca-islamic-umalqura', options).format(arDate);

        // ৩. বাংলা (বাংলাদেশি নিয়ম)
        document.getElementById('bn').innerText = getBnDate(now);
    }

    function getBnDate(date) {
        const d = date.getDate(), m = date.getMonth() + 1, y = date.getFullYear();
        let bY = y - 593;
        const bnM = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
        const bnD = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30];
        if ((y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0)) bnD[10] = 31;

        let diff = Math.floor((date - new Date(y, 3, 14)) / 86400000);
        if (diff < 0) {
            bY--;
            diff = Math.floor((date - new Date(y - 1, 3, 14)) / 86400000);
        }

        let i = 0;
        while (diff >= bnD[i]) { diff -= bnD[i]; i++; }
        return `${diff + 1} ${bnM[i]}, ${bY}`;
    }

    function saveAdj() {
        adjustment = parseInt(document.getElementById('adj').value);
        localStorage.setItem('arAdj', adjustment);
        render();
        document.getElementById('admin-panel').style.display = 'none';
        alert("আরবি তারিখ আপডেট হয়েছে!");
    }

    render();
</script>

</body>
</html>
