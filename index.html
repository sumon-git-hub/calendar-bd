<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; margin: 0; padding-bottom: 90px; }
        .app-container { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        
        /* Premium Gradient Header */
        .header { background: linear-gradient(135deg, #059669 0%, #047857 100%); padding: 40px 20px 30px; text-align: center; color: white; border-radius: 0 0 40px 40px; position: relative; box-shadow: 0 10px 25px rgba(5, 150, 105, 0.15); }
        .clock { font-family: 'Poppins', sans-serif; font-size: 30px; font-weight: 700; margin: 8px 0; }
        .scroll-box { background: rgba(0,0,0,0.1); padding: 4px 15px; border-radius: 50px; font-size: 13px; margin-top: 15px; overflow: hidden; }

        /* Floating Nav */
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: white; display: flex; justify-content: space-around; padding: 12px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.12); z-index: 1000; border: 1px solid #f1f5f9; }
        .nav-link { color: #94a3b8; text-align: center; font-size: 10px; font-weight: 700; text-transform: uppercase; transition: 0.3s; width: 25%; }
        .nav-link.active { color: #059669; }
        .nav-link svg { width: 22px; height: 22px; margin: 0 auto 4px; }

        /* Calendar Styling */
        .eng-num { font-family: 'Poppins', sans-serif; }
        .day-box { height: 70px; display: flex; flex-direction: column; items-center; justify-content: center; text-align: center; border-radius: 15px; background: #f8fafc; border: 1px solid #f1f5f9; transition: 0.2s; cursor: pointer; }
        .is-today { background: #2563eb !important; color: white !important; box-shadow: 0 8px 15px rgba(37, 99, 235, 0.3); }
        .tab-content { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        input { width: 100%; padding: 15px; border: 2px solid #f1f5f9; border-radius: 15px; outline: none; margin-bottom: 15px; }
        input:focus { border-color: #059669; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="absolute top-6 right-8 text-2xl opacity-50 cursor-pointer" onclick="openAdmin()">⋮</div>
        <p class="text-[10px] tracking-[0.3em] font-bold opacity-70 uppercase">My Smart Calendar</p>
        <div id="clockDisplay" class="clock">00:00:00</div>
        <div class="scroll-box"><marquee id="marq" scrollamount="4">স্বাগতম সুমন ভাই!</marquee></div>
    </div>

    <div id="cal" class="tab-content active">
        <div class="text-center mb-8">
            <h2 id="bnDayTitle" class="text-2xl font-bold text-slate-800">...</h2>
            <div class="flex justify-center gap-2 mt-3">
                <span id="hjInfo" class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold"></span>
                <span id="bnInfo" class="bg-orange-50 text-orange-700 px-3 py-1 rounded-full text-xs font-bold"></span>
            </div>
        </div>

        <div class="flex justify-between items-center px-4 mb-6">
            <button onclick="changeMonth(-1)" class="text-2xl text-slate-300">❮</button>
            <div id="monthYear" class="text-xl font-bold text-slate-700 eng-num uppercase"></div>
            <button onclick="changeMonth(1)" class="text-2xl text-slate-300">❯</button>
        </div>

        <div class="grid grid-cols-7 gap-2 text-center text-[10px] font-bold text-slate-300 uppercase mb-3">
            <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-400">Fri</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
    </div>

    <div id="age" class="tab-content p-8">
        <h3 class="text-xl font-bold mb-6">বয়স ক্যালকুলেটর</h3>
        <input type="date" id="dob" class="eng-num">
        <button onclick="calcAge()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold">হিসাব করুন</button>
        <div id="ageOut" class="hidden mt-8 p-6 bg-slate-900 text-white rounded-3xl text-center">
            <p class="text-xs opacity-50 mb-1 uppercase">বর্তমান বয়স</p>
            <div id="ageVal" class="text-xl font-bold"></div>
        </div>
    </div>

    <div id="hol" class="tab-content p-6">
        <h3 class="text-xl font-bold mb-6">ছুটির তালিকা ২০২৬</h3>
        <div class="space-y-3" id="hList"></div>
    </div>

    <div id="pro" class="tab-content p-8 text-center">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full mx-auto flex items-center justify-center text-3xl font-bold mb-4">S</div>
        <h2 id="userName" class="text-xl font-bold">সুমন ভাই</h2>
        <div class="mt-10 text-left">
            <label class="text-[10px] font-bold text-slate-400 uppercase">নাম পরিবর্তন</label>
            <input type="text" id="uInp" class="mt-2" placeholder="আপনার নাম...">
            <button onclick="saveName()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold">আপডেট</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-link active" onclick="switchTab('cal', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span>Calendar</span>
    </div>
    <div class="nav-link" onclick="switchTab('age', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <span>Age</span>
    </div>
    <div class="nav-link" onclick="switchTab('hol', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        <span>Holiday</span>
    </div>
    <div class="nav-link" onclick="switchTab('pro', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Profile</span>
    </div>
</nav>

<script>
    let cY = new Date().getFullYear(), cM = new Date().getMonth();
    const bMs = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];
    const hMs = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const eMs = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dBs = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function switchTab(t, e) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(t).classList.add('active');
        e.classList.add('active');
    }

    function render(y, m) {
        const g = document.getElementById('calendarGrid'), today = new Date();
        g.innerHTML = ''; document.getElementById('monthYear').innerText = `${eMs[m]} ${y}`;
        const first = (new Date(y, m, 1).getDay() + 1) % 7, total = new Date(y, m + 1, 0).getDate();
        for(let i=0; i<first; i++) g.innerHTML += '<div></div>';
        for(let d=1; d<=total; d++) {
            const dt = new Date(y, m, d), isT = dt.toDateString() === today.toDateString();
            let diff = Math.floor((dt - new Date(2026, 4, 3)) / 86400000);
            let hD = ((diff + 14) % 29 + 29) % 29 || 29, hMi = (Math.floor((diff + 14) / 29) % 12 + 12) % 12;
            let bDiff = Math.floor((dt - new Date(2026, 3, 14)) / 86400000) + 1, bMi = 0, bD = bDiff;
            const bL = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; while(bMi < 12 && bD > bL[bMi]) { bD -= bL[bMi]; bMi++; }
            g.innerHTML += `<div class="day-box ${isT?'is-today':''}"><span class="text-lg font-bold eng-num ${dt.getDay()===5&&!isT?'text-red-500':''}">${d}</span><span class="text-[9px] opacity-40 font-bold eng-num">${hD}/${bD}</span></div>`;
            if(isT) { document.getElementById('bnDayTitle').innerText = `আজ ${dBs[dt.getDay()]}`; document.getElementById('hjInfo').innerText = `🌙 ${hD} ${hMs[hMi]}`; document.getElementById('bnInfo').innerText = `🌾 ${bD} ${bMs[bMi]}`; }
        }
    }

    function calcAge() {
        const v = document.getElementById('dob').value; if(!v) return;
        const b = new Date(v), n = new Date();
        let y = n.getFullYear()-b.getFullYear(), m = n.getMonth()-b.getMonth(), d = n.getDate()-b.getDate();
        if(d<0) { m--; d+=new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
        if(m<0) { y--; m+=12; }
        document.getElementById('ageOut').classList.remove('hidden');
        document.getElementById('ageVal').innerText = `${y} বছর, ${m} মাস, ${d} দিন`;
    }

    function saveName() { const n = document.getElementById('uInp').value; if(n) { document.getElementById('userName').innerText = n; localStorage.setItem('u', n); } }
    function openAdmin() { const p = prompt("Pass:"); if(p==="1212") { const m = prompt("New Message:"); if(m) { document.getElementById('marq').innerText = m; localStorage.setItem('m', m); } } }
    function changeMonth(s) { cM += s; if(cM>11){cM=0;cY++;} else if(cM<0){cM=11;cY--;} render(cY, cM); }

    const hl = [{n:"শহীদ দিবস", d:"২১ ফেব্রুয়ারি"}, {n:"স্বাধীনতা দিবস", d:"২৬ মার্চ"}, {n:"ঈদুল ফিতর", d:"২০ মার্চ"}, {n:"পহেলা বৈশাখ", d:"১৪ এপ্রিল"}];
    hl.forEach(x => { document.getElementById('hList').innerHTML += `<div class="bg-slate-50 p-4 rounded-2xl flex justify-between"><b>${x.n}</b><span class="text-xs opacity-50">${x.d}</span></div>`; });

    const su = localStorage.getItem('u'), sm = localStorage.getItem('m');
    if(su) document.getElementById('userName').innerText = su; if(sm) document.getElementById('marq').innerText = sm;
    setInterval(() => { document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString('en-US', {hour12:false}); }, 1000);
    render(cY, cM);
</script>
</body>
</html>
