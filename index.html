<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .eng { font-family: 'Poppins', sans-serif; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #059669; padding: 25px; text-align: center; color: white; border-radius: 0 0 25px 25px; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px; text-align: center; }
        .day-box { height: 62px; display: flex; flex-direction: column; justify-content: center; background: #fff; border: 1px solid #f1f5f9; border-radius: 12px; }
        .today { background: #2563eb !important; color: white !important; border: none; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); }
    </style>
</head>
<body>

<div class="main-card shadow-2xl">
    <div class="header">
        <h1 class="text-xl font-bold">My Smart Calendar</h1>
        <div id="liveClock" class="text-2xl font-bold mt-2 eng tracking-wider">00:00:00 AM</div>
    </div>

    <div class="p-6 text-center">
        <h2 id="topDayName" class="text-2xl font-bold text-emerald-800">লোড হচ্ছে...</h2>
        <div id="topEng" class="text-lg text-gray-500 mt-1 eng font-semibold tracking-tight"></div>
        <div id="topHij" class="text-lg text-gray-600 font-medium"></div>
        <div id="topBan" class="text-lg text-gray-600 font-medium"></div>
    </div>

    <div class="flex justify-between items-center px-10 py-2">
        <button onclick="moveMonth(-1)" class="text-3xl font-bold p-2 text-gray-300 hover:text-emerald-600">❮</button>
        <div id="monthLabel" class="text-xl font-bold text-gray-800 eng">May 2026</div>
        <button onclick="moveMonth(1)" class="text-3xl font-bold p-2 text-gray-300 hover:text-emerald-600">❯</button>
    </div>

    <div class="grid-7 text-[10px] font-bold text-gray-400 uppercase tracking-widest eng mt-2">
        <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-500">Fri</div>
    </div>
    <div id="calGrid" class="grid-7"></div>

    <div class="mt-auto p-6 text-center text-[12px] text-red-600 font-bold">
        * আরবি তারিখ চাঁদ দেখার উপর নির্ভরশীল
    </div>
</div>

<script>
    // আপনার Firebase Config এখানে বসান
    const firebaseConfig = { databaseURL: "https://YOUR_DATABASE_URL.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let viewY = 2026, viewM = 4, adjH = 0;

    const hijMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
    const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const bnDays = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    // প্রথমে একবার রেন্ডার করে নেওয়া যাতে স্ক্রিন সাদা না থাকে
    updateUI();

    // এরপর Firebase থেকে ডেটা আসলে আপডেট হবে
    db.ref('hijriAdj').on('value', (snap) => {
        adjH = snap.val() || 0;
        updateUI();
    });

    function updateUI() {
        const grid = document.getElementById('calGrid');
        if(!grid) return;
        grid.innerHTML = '';
        document.getElementById('monthLabel').innerText = `${engMonths[viewM]} ${viewY}`;

        const first = new Date(viewY, viewM, 1).getDay();
        const offset = (first + 1) % 7;
        const totalDays = new Date(viewY, viewM + 1, 0).getDate();

        for (let i = 0; i < offset; i++) grid.innerHTML += '<div></div>';

        const base = new Date(2026, 4, 3); // বেস ৩ মে ২০২৬

        for (let d = 1; d <= totalDays; d++) {
            const date = new Date(viewY, viewM, d);
            const diff = Math.round((date - base) / 86400000);
            
            let hD = ((diff + 14) % 29 + 29) % 29;
            if(hD === 0) hD = 29;
            let hMIdx = (Math.floor((diff + 14) / 29) % 12 + 12) % 12;

            // ১ তারিখকে ৩০ বানানোর স্পেশাল লজিক
            if (adjH > 0 && hD === 1) { 
                hD = 30; 
                hMIdx = (hMIdx - 1 + 12) % 12; 
            }

            let bD = Math.round((date - new Date(2026, 3, 14)) / 86400000) + 1;
            let bMIdx = 0, bLens = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30];
            for(let j=0; j<12; j++){ if(bD <= bLens[j]){ bMIdx = j; break; } bD -= bLens[j]; }

            const isT = (date.toDateString() === new Date().toDateString());
            grid.innerHTML += `<div class="day-box ${isT?'today':''}">
                <div class="font-bold text-lg eng leading-tight">${d}</div>
                <div class="text-[9px] font-bold opacity-80">${hD}/${bD}</div>
            </div>`;

            if(isT) {
                document.getElementById('topDayName').innerText = `আজ ${bnDays[date.getDay()]}`;
                document.getElementById('topEng').innerText = `${d} ${engMonths[viewM]} ${viewY} AD`;
                document.getElementById('topHij').innerText = `${hD} ${hijMonths[hMIdx]} 1447 হিজরি`;
                document.getElementById('topBan').innerText = `${bD} ${banMonths[bMIdx]} 1433 বঙ্গাব্দ`;
            }
        }
    }

    function moveMonth(v) { viewM += v; if(viewM>11){viewM=0;viewY++;} else if(viewM<0){viewM=11;viewY--;} updateUI(); }
    setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('en-US'); }, 1000);
</script>
</body>
</html>
