<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f1f5f9; margin: 0; padding-bottom: 80px; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.1); }
        
        /* Header & Clock */
        .header-section { background: linear-gradient(135deg, #059669 0%, #047857 100%); padding: 35px 20px 25px 20px; text-align: center; color: white; border-radius: 0 0 40px 40px; position: relative; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 8px 25px; border-radius: 20px; font-size: 24px; margin-top: 10px; font-family: 'Poppins', sans-serif; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Footer Navigation */
        .footer-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background: white; display: flex; justify-content: space-around; align-items: center; padding: 12px 5px; border-top: 1px solid #f1f5f9; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; cursor: pointer; transition: 0.3s; width: 25%; }
        .nav-item.active { color: #059669; }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; }
        .nav-item span { font-size: 11px; font-weight: 600; }

        /* Calendar Grid */
        .eng-num { font-family: 'Poppins', sans-serif; }
        .day-cell { height: 70px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #ffffff; border-radius: 15px; border: 1px solid #f1f5f9; cursor: pointer; transition: 0.2s; }
        .day-cell:active { transform: scale(0.95); background: #f8fafc; }
        .today-mark { background: #2563eb !important; color: white !important; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); border: none; }
        .friday-text { color: #ef4444 !important; font-weight: 700; }
        
        /* Modals */
        #detailModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: white; width: 100%; max-width: 380px; border-radius: 25px; padding: 25px; max-height: 80vh; overflow-y: auto; }

        /* Holiday Style */
        .holiday-list { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-radius: 15px; padding: 12px 15px; margin-bottom: 8px; border-left: 4px solid #059669; }
        .holiday-date { color: #059669; font-weight: 700; font-family: 'Poppins', sans-serif; font-size: 13px; width: 80px; }
        .holiday-name { color: #1e293b; font-weight: 600; font-size: 14px; flex: 1; text-align: right; }
        
        .note-item { display: flex; align-items: center; gap: 10px; background: #f1f5f9; padding: 12px; border-radius: 12px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header-section">
        <h1 class="text-[10px] font-bold font-[Poppins] opacity-60 uppercase tracking-[0.3em]">My Smart Calendar</h1>
        <div id="liveTime" class="clock-pill">00:00:00 AM</div>
        <div class="w-full mt-4 overflow-hidden whitespace-nowrap text-sm text-emerald-100">
            <marquee>স্বাগতম! ২০২৬ সালের সকল সরকারি ছুটির তালিকা এখানে পাবেন।</marquee>
        </div>
    </div>

    <div id="calendar-content" class="pt-8 pb-6 px-4">
        <div class="text-center">
            <h2 id="topDayName" class="text-3xl font-bold text-slate-800 mb-1">...</h2>
            <p id="topEng" class="text-md font-semibold text-slate-400 mb-5 eng-num"></p>
            <div class="flex justify-center gap-2">
                <div class="bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-100"><p id="topHijri" class="text-emerald-700 font-bold text-xs"></p></div>
                <div class="bg-orange-50 px-3 py-1.5 rounded-xl border border-orange-100"><p id="topBangla" class="text-orange-700 font-bold text-xs"></p></div>
            </div>
        </div>
        
        <div class="flex justify-between items-center px-4 mt-8 mb-4">
            <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500">❮</button>
            <div id="monthDisplay" class="text-xl font-bold text-slate-800 eng-num uppercase tracking-wider"></div>
            <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500">❯</button>
        </div>

        <div class="grid grid-cols-7 gap-2 px-1 mb-2 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">
            <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-400">Fri</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-2 px-1"></div>
    </div>

    <div id="holiday-content" class="p-5 hidden">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">সরকারি ছুটি ২০২৬</h2>
        <div id="holidayListContainer" class="pb-10">
            </div>
    </div>

    <div id="empty-content" class="p-10 text-center text-slate-400 hidden">
        <div class="py-20">
            <svg class="w-16 h-16 mx-auto mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-lg font-bold">শীঘ্রই আসছে...</p>
        </div>
    </div>
</div>

<div class="footer-nav">
    <div class="nav-item active" onclick="switchTab('calendar', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span>Calendar</span>
    </div>
    <div class="nav-item" onclick="switchTab('holiday', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        <span>Holiday</span>
    </div>
    <div class="nav-item" onclick="switchTab('empty', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <span>Age Calc</span>
    </div>
    <div class="nav-item" onclick="switchTab('empty', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Profile</span>
    </div>
</div>

<div id="detailModal">
    <div class="modal-box">
        <div id="modalContent"></div>
        <button onclick="closeModal()" class="w-full bg-slate-100 py-3 rounded-xl mt-4 text-slate-600 font-bold">বন্ধ করুন</button>
    </div>
</div>

<script>
    let currentYear = 2026, currentMonth = new Date().getMonth();
    const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];
    const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];

    const holidays = [
        { d: "21 Feb", n: "শহীদ দিবস" },
        { d: "26 Feb", n: "শবে বরাত*" },
        { d: "17 Mar", n: "বঙ্গবন্ধুর জন্মদিন ও শবে কদর*" },
        { d: "20 Mar", n: "জুমাতুল বিদা" },
        { d: "21-23 Mar", n: "ঈদুল ফিতর*" },
        { d: "26 Mar", n: "স্বাধীনতা দিবস" },
        { d: "14 Apr", n: "বাংলা নববর্ষ" },
        { d: "01 May", n: "মে দিবস ও বুদ্ধ পূর্ণিমা*" },
        { d: "27-29 May", n: "ঈদুল আযহা*" },
        { d: "28 Jul", n: "আশুরা*" },
        { d: "05 Aug", n: "ছাত্র-জনতার অভ্যুত্থান দিবস" },
        { d: "16 Aug", n: "জন্মাষ্টমী" },
        { d: "27 Aug", n: "ঈদে মিলাদুন্নবী (সাঃ)*" },
        { d: "20-21 Oct", n: "দুর্গাপূজা" },
        { d: "07 Nov", n: "বিপ্লব ও সংহতি দিবস" },
        { d: "16 Dec", n: "বিজয় দিবস" },
        { d: "25 Dec", n: "বড় দিন" }
    ];

    function getExtraDates(dateObj) {
        // Simple mock logic for Hijri/Bangla for 2026
        let diff = Math.floor((dateObj - new Date(2026, 0, 1)) / 86400000);
        let hDate = ((diff + 12) % 29) + 1, hM = Math.floor((diff + 12) / 29) % 12;
        let bDate = ((diff + 17) % 30) + 1, bM = Math.floor((diff + 17) / 30) % 12;
        return { hDate, hM: hijriMonths[hM], bDate, bM: banglaMonths[bM] };
    }

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        document.getElementById('monthDisplay').innerText = `${engMonths[month]} ${year}`;
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const startPos = (firstDay + 1) % 7;

        for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const isToday = (dateObj.toDateString() === new Date().toDateString());
            const data = getExtraDates(dateObj);
            const isFri = dateObj.getDay() === 5;

            const cell = document.createElement('div');
            cell.className = `day-cell ${isToday ? 'today-mark' : ''}`;
            cell.innerHTML = `
                <div class="text-xl font-bold eng-num ${isFri && !isToday ? 'friday-text' : ''}">${day}</div>
                <div class="text-[9px] font-bold opacity-40 eng-num">${data.hDate}/${data.bDate}</div>
            `;
            cell.onclick = () => openPop(day, month, year, dateObj.getDay(), data);
            grid.appendChild(cell);

            if (isToday) {
                document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dateObj.getDay()]}`;
                document.getElementById('topEng').innerText = `${day} ${engMonths[month]} ${year}`;
                document.getElementById('topHijri').innerText = `🌙 ${data.hDate} ${data.hM} 1447`;
                document.getElementById('topBangla').innerText = `🌾 ${data.bDate} ${data.bM} 1433`;
            }
        }
    }

    function openPop(d, m, y, dayIdx, data) {
        const content = document.getElementById('modalContent');
        content.innerHTML = `
            <h2 class="text-2xl font-bold text-slate-800">${dayNamesBn[dayIdx]}</h2>
            <p class="text-slate-400 mb-4 eng-num">${d} ${engMonths[m]} ${y}</p>
            <div class="space-y-2">
                <div class="bg-emerald-50 p-3 rounded-lg text-emerald-700 font-bold">🌙 হিজরি: ${data.hDate} ${data.hM}</div>
                <div class="bg-orange-50 p-3 rounded-lg text-orange-700 font-bold">🌾 বাংলা: ${data.bDate} ${data.bM}</div>
            </div>
        `;
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    function switchTab(tab, el) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('calendar-content').classList.add('hidden');
        document.getElementById('holiday-content').classList.add('hidden');
        document.getElementById('empty-content').classList.add('hidden');
        document.getElementById(`${tab}-content`).classList.remove('hidden');
        
        if(tab === 'holiday') {
            const container = document.getElementById('holidayListContainer');
            container.innerHTML = holidays.map(h => `
                <div class="holiday-list">
                    <span class="holiday-date">${h.d}</span>
                    <span class="holiday-name">${h.n}</span>
                </div>
            `).join('') + `<p class="text-center text-[10px] text-slate-400 mt-4">* চাঁদ দেখার ওপর নির্ভরশীল</p>`;
        }
    }

    function changeMonth(step) {
        currentMonth += step;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar(currentYear, currentMonth);
    }

    setInterval(() => {
        document.getElementById('liveTime').innerText = new Date().toLocaleTimeString('en-US', { hour12: true });
    }, 1000);

    renderCalendar(currentYear, currentMonth);
</script>

</body>
</html>
