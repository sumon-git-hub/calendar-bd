<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f1f5f9; margin: 0; padding-bottom: 80px; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.1); }
        
        /* Header */
        .header-section { background: linear-gradient(135deg, #059669 0%, #047857 100%); padding: 35px 20px 25px 20px; text-align: center; color: white; border-radius: 0 0 40px 40px; position: relative; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 8px 25px; border-radius: 20px; font-size: 24px; margin-top: 10px; font-family: 'Poppins', sans-serif; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Nav */
        .footer-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background: white; display: flex; justify-content: space-around; align-items: center; padding: 12px 5px; border-top: 1px solid #f1f5f9; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; cursor: pointer; width: 25%; }
        .nav-item.active { color: #059669; }
        .nav-item span { font-size: 11px; font-weight: 600; }

        /* Calendar Grid */
        .eng-num { font-family: 'Poppins', sans-serif; }
        .day-cell { height: 70px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #ffffff; border-radius: 15px; border: 1px solid #f1f5f9; transition: 0.2s; }
        .today-mark { background: #2563eb !important; color: white !important; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); border: none; }
        .friday-text { color: #ef4444 !important; font-weight: 700; }
        
        /* Modal */
        #detailModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: white; width: 100%; max-width: 380px; border-radius: 25px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }

        /* Holiday List */
        .holiday-list { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-radius: 15px; padding: 12px 15px; margin-bottom: 8px; border-left: 4px solid #059669; }
        .holiday-date { color: #059669; font-weight: 700; font-family: 'Poppins', sans-serif; font-size: 13px; width: 85px; }
        .holiday-name { color: #1e293b; font-weight: 600; font-size: 14px; flex: 1; text-align: right; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header-section">
        <h1 class="text-[10px] font-bold font-[Poppins] opacity-60 uppercase tracking-[0.3em]">Smart Calendar 2026</h1>
        <div id="liveTime" class="clock-pill">00:00:00 AM</div>
        <div class="w-full mt-4 overflow-hidden whitespace-nowrap text-xs text-emerald-100">
            <marquee>২০২৬ সালের সকল সরকারি ও ধর্মীয় ছুটির পূর্ণাঙ্গ তালিকা এখানে পাবেন।</marquee>
        </div>
    </div>

    <div id="calendar-content" class="pt-8 pb-6 px-4">
        <div class="text-center">
            <h2 id="topDayName" class="text-3xl font-bold text-slate-800 mb-1">...</h2>
            <p id="topEng" class="text-md font-semibold text-slate-400 mb-5 eng-num"></p>
            <div class="flex justify-center gap-2">
                <div class="bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-100"><p id="topHijri" class="text-emerald-700 font-bold text-xs"></p></div>
                <div class="bg-orange-50 px-3 py-1.5 rounded-xl border border-orange-100"><p id="topBangla" class="text-orange-700 font-bold text-xs"></p></div>
            </div>
        </div>
        
        <div class="flex justify-between items-center px-4 mt-8 mb-4">
            <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500">❮</button>
            <div id="monthDisplay" class="text-xl font-bold text-slate-800 eng-num uppercase"></div>
            <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500">❯</button>
        </div>

        <div class="grid grid-cols-7 gap-2 px-1 mb-2 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">
            <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-400">Fri</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-2 px-1"></div>
    </div>

    <div id="holiday-content" class="p-5 hidden">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">সরকারি ছুটির তালিকা</h2>
        <div id="holidayListContainer" class="pb-10"></div>
    </div>

    <div id="empty-content" class="p-10 text-center text-slate-400 hidden py-40">
        <p class="text-lg font-bold">শীঘ্রই আসছে...</p>
    </div>
</div>

<div class="footer-nav">
    <div class="nav-item active" onclick="switchTab('calendar', this)">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span>Calendar</span>
    </div>
    <div class="nav-item" onclick="switchTab('holiday', this)">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        <span>Holiday</span>
    </div>
    <div class="nav-item" onclick="switchTab('empty', this)">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01"></path></svg>
        <span>Age</span>
    </div>
    <div class="nav-item" onclick="switchTab('empty', this)">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Profile</span>
    </div>
</div>

<div id="detailModal">
    <div class="modal-box">
        <div id="modalContent"></div>
        <div class="mt-4 pt-4 border-t border-slate-100">
            <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">নোট / বিশেষ ইভেন্ট</h4>
            <div id="modalNote" class="bg-slate-50 p-3 rounded-xl text-sm text-slate-600 italic">কোনো বিশেষ নোট নেই</div>
        </div>
        <button onclick="closeModal()" class="w-full bg-slate-900 text-white py-3 rounded-xl mt-6 font-bold">বন্ধ করুন</button>
    </div>
</div>

<script>
    let currentYear = 2026, currentMonth = new Date().getMonth();
    const monthsEng = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const daysBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];
    const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];

    const holidays = [
        { d: 21, m: 1, n: "শহীদ দিবস", note: "আন্তর্জাতিক মাতৃভাষা দিবস" },
        { d: 26, m: 1, n: "শবে বরাত*", note: "পবিত্র শবে বরাত (সম্ভাব্য তারিখ)" },
        { d: 17, m: 2, n: "বঙ্গবন্ধুর জন্মদিন", note: "বঙ্গবন্ধুর জন্মদিন ও শবে কদর*" },
        { d: 20, m: 2, n: "জুমাতুল বিদা", note: "পবিত্র রমজানের শেষ শুক্রবার" },
        { d: 21, m: 2, n: "ঈদুল ফিতর*", note: "ঈদুল ফিতরের ছুটি শুরু" },
        { d: 22, m: 2, n: "ঈদুল ফিতর*", note: "পবিত্র ঈদুল ফিতর" },
        { d: 23, m: 2, n: "ঈদুল ফিতর*", note: "ঈদুল ফিতরের ৩য় দিন" },
        { d: 26, m: 2, n: "স্বাধীনতা দিবস", note: "মহান স্বাধীনতা ও জাতীয় দিবস" },
        { d: 14, m: 3, n: "বাংলা নববর্ষ", note: "পহেলা বৈশাখ ১৪৩৩" },
        { d: 1, m: 4, n: "মে দিবস", note: "শ্রমিক দিবস ও বুদ্ধ পূর্ণিমা*" },
        { d: 27, m: 4, n: "ঈদুল আযহা*", note: "ঈদুল আযহা ছুটি শুরু" },
        { d: 28, m: 4, n: "ঈদুল আযহা*", note: "পবিত্র ঈদুল আযহা" },
        { d: 29, m: 4, n: "ঈদুল আযহা*", note: "ঈদুল আযহার ৩য় দিন" },
        { d: 28, m: 6, n: "আশুরা*", note: "পবিত্র আশুরা (১০ই মুহাররম)" },
        { d: 5, m: 7, n: "অভ্যুত্থান দিবস", note: "ছাত্র-জনতার অভ্যুত্থান দিবস" },
        { d: 16, m: 7, n: "জন্মাষ্টমী", note: "শ্রীকৃষ্ণের শুভ জন্মাষ্টমী" },
        { d: 27, m: 7, n: "ঈদে মিলাদুন্নবী*", note: "নবী মুহাম্মদ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর জন্মদিন" },
        { d: 20, m: 9, n: "দুর্গাপূজা", note: "মহা নবমী" },
        { d: 21, m: 9, n: "দুর্গাপূজা", note: "বিজয় দশমী" },
        { d: 7, m: 10, n: "জাতীয় বিপ্লব দিবস", note: "জাতীয় বিপ্লব ও সংহতি দিবস" },
        { d: 16, m: 11, n: "বিজয় দিবস", note: "মহান বিজয় দিবস" },
        { d: 25, m: 11, n: "বড় দিন", note: "যিশু খ্রিস্টের জন্মদিন" }
    ];

    function getExtra(dateObj) {
        let diff = Math.floor((dateObj - new Date(2026, 0, 1)) / 86400000);
        return { 
            hD: ((diff + 12) % 29) + 1, hM: hijriMonths[Math.floor((diff + 12) / 29) % 12],
            bD: ((diff + 17) % 30) + 1, bM: banglaMonths[Math.floor((diff + 17) / 30) % 12]
        };
    }

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        document.getElementById('monthDisplay').innerText = `${monthsEng[month]} ${year}`;
        const first = new Date(year, month, 1).getDay();
        const daysTotal = new Date(year, month + 1, 0).getDate();
        const start = (first + 1) % 7;

        for (let i = 0; i < start; i++) grid.innerHTML += '<div></div>';

        for (let d = 1; d <= daysTotal; d++) {
            const dateObj = new Date(year, month, d);
            const isToday = (dateObj.toDateString() === new Date().toDateString());
            const data = getExtra(dateObj);
            const hol = holidays.find(h => h.d === d && h.m === month);
            
            const cell = document.createElement('div');
            cell.className = `day-cell ${isToday ? 'today-mark' : ''} ${hol ? 'bg-emerald-50 border-emerald-100' : ''}`;
            cell.innerHTML = `
                <div class="text-xl font-bold eng-num ${dateObj.getDay() === 5 && !isToday ? 'friday-text' : ''}">${d}</div>
                <div class="text-[9px] font-bold opacity-40 eng-num">${data.hD}/${data.bD}</div>
            `;
            cell.onclick = () => openPop(d, month, year, dateObj.getDay(), data, hol);
            grid.appendChild(cell);

            if (isToday) {
                document.getElementById('topDayName').innerText = `আজ ${daysBn[dateObj.getDay()]}`;
                document.getElementById('topEng').innerText = `${d} ${monthsEng[month]} ${year}`;
                document.getElementById('topHijri').innerText = `🌙 ${data.hD} ${data.hM} 1447`;
                document.getElementById('topBangla').innerText = `🌾 ${data.bD} ${data.bM} 1433`;
            }
        }
    }

    function openPop(d, m, y, dayIdx, data, hol) {
        document.getElementById('modalContent').innerHTML = `
            <h2 class="text-2xl font-bold text-slate-800">${daysBn[dayIdx]}</h2>
            <p class="text-slate-400 mb-4 eng-num">${d} ${monthsEng[m]} ${y}</p>
            <div class="space-y-2">
                <div class="bg-emerald-50 p-3 rounded-lg text-emerald-700 font-bold text-sm">🌙 হিজরি: ${data.hD} ${data.hM}</div>
                <div class="bg-orange-50 p-3 rounded-lg text-orange-700 font-bold text-sm">🌾 বাংলা: ${data.bD} ${data.bM}</div>
            </div>
        `;
        document.getElementById('modalNote').innerText = hol ? hol.note : "এই দিনে কোনো বিশেষ ইভেন্ট নেই।";
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    function switchTab(tab, el) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        ['calendar', 'holiday', 'empty'].forEach(c => document.getElementById(`${c}-content`).classList.add('hidden'));
        document.getElementById(`${tab}-content`).classList.remove('hidden');
        
        if(tab === 'holiday') {
            document.getElementById('holidayListContainer').innerHTML = holidays.map(h => `
                <div class="holiday-list">
                    <span class="holiday-date">${h.d} ${monthsEng[h.m].substring(0,3)}</span>
                    <span class="holiday-name">${h.n}</span>
                </div>
            `).join('') + `<p class="text-center text-[10px] text-slate-400 mt-4">* চাঁদ দেখার ওপর নির্ভরশীল</p>`;
        }
    }

    function changeMonth(s) {
        currentMonth += s;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar(currentYear, currentMonth);
    }

    setInterval(() => {
        document.getElementById('liveTime').innerText = new Date().toLocaleTimeString('en-US', { hour12: true });
    }, 1000);

    renderCalendar(currentYear, currentMonth);
</script>
</body>
</html>
