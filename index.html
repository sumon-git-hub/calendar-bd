<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .header-section { background-color: #059669; padding: 25px; text-align: center; color: white; border-radius: 0 0 25px 25px; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 8px 30px; border-radius: 50px; font-size: 22px; margin-top: 15px; font-family: 'Poppins', sans-serif; }
        .admin-btn { position: absolute; top: 25px; right: 20px; cursor: pointer; font-size: 24px; color: white; }
        .admin-dropdown { display: none; position: absolute; top: 60px; right: 20px; background: #1e293b; color: white; padding: 15px; border-radius: 12px; z-index: 50; width: 160px; }
        .date-display { padding: 30px 20px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 15px; }
        .day-cell { height: 65px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; cursor: pointer; }
        .today-mark { background: #2563eb !important; border: none; color: white !important; }
        .friday-text { color: #ef4444 !important; }
        .red-star { color: #ef4444; font-weight: bold; }
        .eng-num { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>

<div class="main-card shadow-lg">
    <div class="header-section">
        <div class="admin-btn" onclick="checkAdmin()">⋮</div>
        <div id="adminPanel" class="admin-dropdown">
            <h3 class="text-xs font-bold mb-2 text-yellow-400">হিজরি সমন্বয়</h3>
            <div class="flex items-center justify-between gap-2">
                <button onclick="adjustHijri(-1)" class="bg-red-500 w-8 h-8 rounded">-</button>
                <span id="adjVal" class="font-bold eng-num">0</span>
                <button onclick="adjustHijri(1)" class="bg-emerald-500 w-8 h-8 rounded">+</button>
            </div>
            <p class="text-[9px] mt-2 text-gray-400">* +1 দিলে ১ তারিখ ৩০ হবে</p>
        </div>
        <h1 class="text-2xl font-bold font-[Poppins]">My Smart Calendar</h1>
        <div id="liveTime" class="clock-pill">00:00:00 AM</div>
    </div>

    <div class="date-display">
        <h2 id="topDayName" class="text-2xl font-bold text-emerald-800 mb-2"></h2>
        <div id="topEng" class="text-lg font-semibold text-gray-600 eng-num"></div>
        <div id="topHijri" class="text-lg font-semibold text-slate-700"></div>
        <div id="topBangla" class="text-lg font-semibold text-slate-700"></div>
    </div>

    <div class="flex justify-between items-center px-6 py-4">
        <button onclick="changeMonth(-1)" class="text-2xl font-bold text-gray-400">❮</button>
        <div id="monthDisplay" class="text-xl font-bold text-slate-800 font-[Poppins]"></div>
        <button onclick="changeMonth(1)" class="text-2xl font-bold text-gray-400">❯</button>
    </div>

    <div class="grid-7 pt-0">
        <div class="text-center font-bold text-xs text-gray-400">SAT</div>
        <div class="text-center font-bold text-xs text-gray-400">SUN</div>
        <div class="text-center font-bold text-xs text-gray-400">MON</div>
        <div class="text-center font-bold text-xs text-gray-400">TUE</div>
        <div class="text-center font-bold text-xs text-gray-400">WED</div>
        <div class="text-center font-bold text-xs text-gray-400">THU</div>
        <div class="text-center font-bold text-xs text-red-400">FRI</div>
    </div>

    <div id="calendarGrid" class="grid-7 mt-0"></div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = { databaseURL: "https://YOUR_DATABASE_URL.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth(); 
    let hijriAdjustment = 0;
    let isAdmin = false;

    // ডাটাবেস থেকে সমন্বয় ভ্যালু আনা
    db.ref('hijriAdj').on('value', (snapshot) => {
        hijriAdjustment = snapshot.val() || 0;
        renderCalendar(currentYear, currentMonth);
    });

    function checkAdmin() {
        if(isAdmin) { togglePanel(); } 
        else {
            let pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
            if(pass === "AmiSumon1") { isAdmin = true; togglePanel(); } 
            else { alert("ভুল পাসওয়ার্ড!"); }
        }
    }

    function togglePanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function adjustHijri(val) {
        hijriAdjustment += val;
        db.ref('hijriAdj').set(hijriAdjustment);
    }

    const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
    const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        document.getElementById('monthDisplay').innerText = `${engMonths[month]} ${year}`;
        document.getElementById('adjVal').innerText = hijriAdjustment;

        const firstDay = new Date(year, month, 1).getDay();
        const startPos = (firstDay + 1) % 7; 
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const isToday = (dateObj.toDateString() === new Date().toDateString());
            
            // হিজরি ক্যালকুলেশন (বেস তারিখ: ৪ মে ২০২৬)
            let diffDays = Math.floor((dateObj - new Date(2026, 4, 3)) / (1000*60*60*24));
            let hTotalDays = diffDays + 14; 
            let hDate = ((hTotalDays % 29) + 29) % 29 || 29;
            let hMonthIdx = (Math.floor(hTotalDays / 29) % 12 + 12) % 12;

            // --- বিশেষ সমন্বয় লজিক ---
            let displayHDate = hDate;
            let displayHMonth = hMonthIdx;

            if (hijriAdjustment > 0 && hDate === 1) {
                displayHDate = 30; // ১ তারিখকে ৩০ বানিয়ে দেওয়া হলো
                displayHMonth = (hMonthIdx - 1 + 12) % 12; // মাস আগেরটিই থাকবে
            }

            // বাংলা তারিখ
            let bTotalDays = Math.floor((dateObj - new Date(2026, 3, 14)) / (1000*60*60*24)) + 1;
            let bMonthIdx = 0, bDate = bTotalDays;
            const bLens = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; 
            while(bMonthIdx < 12 && bDate > bLens[bMonthIdx]) { bDate -= bLens[bMonthIdx]; bMonthIdx++; }

            const isFriday = dateObj.getDay() === 5;

            grid.innerHTML += `
                <div class="day-cell ${isToday ? 'today-mark' : ''}">
                    <div class="num-main ${isFriday && !isToday ? 'friday-text' : ''} font-[Poppins]">${day}</div>
                    <div class="text-[10px] ${isToday ? 'text-white' : 'text-gray-400'} font-[Poppins]">
                        ${displayHDate}${hijriAdjustment > 0 && hDate === 1 ? '<span class="red-star">*</span>' : ''}/${bDate}
                    </div>
                </div>
            `;

            if(isToday) {
                document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dateObj.getDay()]}`;
                document.getElementById('topEng').innerText = `${day} ${engMonths[month]} ${year}`;
                document.getElementById('topHijri').innerText = `${displayHDate} ${hijriMonths[displayHMonth]} ১৪৪৭ হিজরি`;
                document.getElementById('topBangla').innerText = `${bDate} ${banglaMonths[bMonthIdx]} ১৪৩৩ বঙ্গাব্দ`;
            }
        }
    }

    function changeMonth(step) {
        currentMonth += step;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar(currentYear, currentMonth);
    }

    setInterval(() => {
        document.getElementById('liveTime').innerText = new Date().toLocaleTimeString('en-US', { hour12: true });
    }, 1000);

    renderCalendar(currentYear, currentMonth);
</script>

</body>
</html>
