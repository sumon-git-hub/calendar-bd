<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.05); }
        
        /* Premium Header */
        .header-section { background: linear-gradient(135deg, #059669 0%, #047857 100%); padding: 30px 20px 20px; text-align: center; color: white; border-radius: 0 0 35px 35px; position: relative; box-shadow: 0 10px 20px rgba(5, 150, 105, 0.2); }
        .clock-container { background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); display: inline-block; padding: 10px 35px; border-radius: 20px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .clock-text { font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 1px; }

        /* Marquee Custom */
        .marquee-box { background: #0369a1; color: #e0f2fe; padding: 6px 0; font-size: 14px; margin-top: -15px; z-index: -1; border-radius: 0 0 15px 15px; overflow: hidden; }

        /* Calendar Grid */
        .day-cell { height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #ffffff; border-radius: 18px; border: 1px solid #f1f5f9; transition: all 0.3s ease; }
        .day-cell:hover { background: #f8fafc; border-color: #e2e8f0; }
        .today-mark { background: #2563eb !important; color: white !important; transform: scale(1.05); box-shadow: 0 8px 15px rgba(37, 99, 235, 0.3); border: none; }
        .friday-text { color: #ef4444 !important; font-weight: 700; }
        
        .note-dot { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; margin-top: 4px; }
        .menu-btn { position: absolute; top: 25px; right: 25px; cursor: pointer; background: rgba(255,255,255,0.2); padding: 5px; border-radius: 10px; }

        /* Modal Design */
        .modal-content { background: white; width: 90%; max-width: 380px; border-radius: 30px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        #detailModal, #adminModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header-section">
        <div class="menu-btn" onclick="openAdmin()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </div>
        <h1 class="text-xl font-bold font-[Poppins] tracking-wide uppercase opacity-90">My Smart Calendar</h1>
        <div class="clock-container">
            <div id="liveTime" class="clock-text">00:00:00 AM</div>
        </div>
    </div>

    <div class="marquee-box">
        <marquee id="scrollMsg" behavior="scroll" direction="left">My Smart Calendar-এ আপনাকে স্বাগতম!</marquee>
    </div>

    <div class="py-8 px-4 text-center">
        <h2 id="topDayName" class="text-3xl font-bold text-slate-800 mb-1">...</h2>
        <div id="topEng" class="text-lg font-semibold text-slate-400 mb-4 font-[Poppins]"></div>
        <div class="flex justify-center gap-3">
            <div class="bg-emerald-50 px-4 py-2 rounded-2xl border border-emerald-100">
                <p id="topHijri" class="text-emerald-700 font-bold text-sm"></p>
            </div>
            <div class="bg-orange-50 px-4 py-2 rounded-2xl border border-orange-100">
                <p id="topBangla" class="text-orange-700 font-bold text-sm"></p>
            </div>
        </div>
    </div>

    <div class="flex justify-between items-center px-10 mb-6">
        <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full transition text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div id="monthDisplay" class="text-2xl font-bold text-slate-800 font-[Poppins]"></div>
        <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full transition text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M9 5l6 6-6 6"></path></svg>
        </button>
    </div>

    <div class="grid grid-cols-7 gap-3 px-5 mb-3 text-center text-[11px] font-bold text-slate-400 uppercase tracking-widest">
        <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-400">Fri</div>
    </div>
    <div id="calendarGrid" class="grid grid-cols-7 gap-3 px-5 pb-12"></div>
</div>

<div id="adminModal" onclick="if(event.target==this) closeAdmin()">
    <div class="modal-content">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">অ্যাডমিন সেটিংস</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-500 mb-2">স্ক্রল মেসেজ পরিবর্তন</label>
                <textarea id="adminMsgInput" class="w-full bg-slate-50 border-none rounded-2xl p-4 h-28 focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700" placeholder="মেসেজ লিখুন..."></textarea>
            </div>
            <button onclick="saveAdminMsg()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-200 active:scale-95 transition">আপডেট করুন</button>
        </div>
    </div>
</div>

<div id="detailModal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <div class="text-center mb-6">
            <h2 id="modalDate" class="text-2xl font-bold text-slate-800 font-[Poppins]"></h2>
            <p id="modalDay" class="text-emerald-600 font-bold text-lg"></p>
        </div>
        <div class="bg-slate-50 rounded-2xl p-5 space-y-3 mb-6">
            <p id="modalHijri" class="text-slate-700 font-medium flex items-center gap-3">🌙 <span id="hTxt"></span></p>
            <p id="modalBangla" class="text-slate-700 font-medium flex items-center gap-3">🌾 <span id="bTxt"></span></p>
        </div>
        <textarea id="noteArea" class="w-full border-2 border-slate-100 rounded-2xl p-4 h-28 outline-none focus:border-emerald-500 transition" placeholder="এই দিনের জন্য কিছু লিখে রাখুন..."></textarea>
        <div class="grid grid-cols-2 gap-4 mt-6">
            <button onclick="saveNote()" class="bg-emerald-600 text-white py-4 rounded-2xl font-bold">সেভ</button>
            <button onclick="closeModal()" class="bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">বন্ধ</button>
        </div>
    </div>
</div>

<script>
    // --- Firebase কনফিগারেশন ---
    // এখানে আপনার ফায়ারবেস ডিটেইলস অবশ্যই বসাতে হবে, নয়তো মেসেজ সেভ হবে না।
    const firebaseConfig = { 
        databaseURL: "https://your-project-id.firebaseio.com/" 
    };
    
    // ফায়ারবেস চেক
    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        
        db.ref('scrollMessage').on('value', (s) => {
            const msg = s.val() || "My Smart Calendar-এ আপনাকে স্বাগতম!";
            document.getElementById('scrollMsg').innerText = msg;
            document.getElementById('adminMsgInput').value = msg;
        });
    } catch(e) { console.log("Firebase not connected yet."); }

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDateKey = "";

    function openAdmin() {
        if(prompt("পাসওয়ার্ড দিন:") === "1212") document.getElementById('adminModal').style.display = 'flex';
        else alert("ভুল পাসওয়ার্ড!");
    }

    function saveAdminMsg() {
        const msg = document.getElementById('adminMsgInput').value;
        if(db) db.ref('scrollMessage').set(msg);
        else alert("ফায়ারবেস কানেক্ট করা নেই!");
        closeAdmin();
    }

    function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

    const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];
    const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        const realToday = new Date();
        grid.innerHTML = '';
        document.getElementById('monthDisplay').innerText = `${engMonths[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const startPos = (firstDay + 1) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const isToday = (dateObj.toDateString() === realToday.toDateString());
            
            let diffDays = Math.floor((dateObj - new Date(2026, 4, 3)) / 86400000);
            let hDate = ((diffDays + 14) % 29 + 29) % 29 || 29;
            let hM = (Math.floor((diffDays + 14) / 29) % 12 + 12) % 12;

            let bDiff = Math.floor((dateObj - new Date(2026, 3, 14)) / 86400000) + 1;
            let bMonthIdx = 0, bDate = bDiff;
            const bLens = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; 
            while(bMonthIdx < 12 && bDate > bLens[bMonthIdx]) { bDate -= bLens[bMonthIdx]; bMonthIdx++; }

            const note = localStorage.getItem(`${year}-${month}-${day}`);
            
            grid.innerHTML += `
                <div class="day-cell ${isToday ? 'today-mark' : ''}" onclick="showDetails(${day}, ${hDate}, '${hijriMonths[hM]}', ${bDate}, '${banglaMonths[bMonthIdx]}', '${dayNamesBn[dateObj.getDay()]}')">
                    <div class="text-xl font-bold font-[Poppins] ${dateObj.getDay() === 5 && !isToday ? 'friday-text' : ''}">${day}</div>
                    <div class="text-[10px] font-bold opacity-60 font-[Poppins]">${hDate}/${bDate}</div>
                    ${note ? '<div class="note-dot"></div>' : ''}
                </div>
            `;

            if(isToday) updateTopDisplay(day, year, month, hDate, hM, bDate, bMonthIdx, dateObj.getDay());
        }
    }

    function updateTopDisplay(d, y, m, hd, hm, bd, bm, dw) {
        document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dw]}`;
        document.getElementById('topEng').innerText = `${d} ${engMonths[m]} ${y} AD`;
        document.getElementById('topHijri').innerText = `${hd} ${hijriMonths[hm]} 1447 হিজরি`;
        document.getElementById('topBangla').innerText = `${bd} ${banglaMonths[bm]} 1433 বঙ্গাব্দ`;
    }

    function showDetails(day, hDate, hMonth, bDate, bMonth, dayName) {
        selectedDateKey = `${currentYear}-${currentMonth}-${day}`;
        document.getElementById('modalDate').innerText = `${day} ${engMonths[currentMonth]} ${currentYear}`;
        document.getElementById('modalDay').innerText = dayName;
        document.getElementById('hTxt').innerText = `${hDate} ${hMonth} 1447 হিজরি`;
        document.getElementById('bTxt').innerText = `${bDate} ${bMonth} 1433 বঙ্গাব্দ`;
        document.getElementById('noteArea').value = localStorage.getItem(selectedDateKey) || "";
        document.getElementById('detailModal').style.display = 'flex';
    }

    function saveNote() {
        localStorage.setItem(selectedDateKey, document.getElementById('noteArea').value);
        closeModal();
        renderCalendar(currentYear, currentMonth);
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    function changeMonth(s) { currentMonth += s; if(currentMonth>11){currentMonth=0;currentYear++;} else if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(currentYear, currentMonth); }
    
    // Live Clock
    setInterval(() => {
        const now = new Date();
        document.getElementById('liveTime').innerText = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }, 1000);

    renderCalendar(currentYear, currentMonth);
</script>
</body>
</html>
