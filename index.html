<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .header-section { background-color: #059669; padding: 20px 20px 10px 20px; text-align: center; color: white; border-radius: 0 0 25px 25px; position: relative; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 8px 30px; border-radius: 50px; font-size: 22px; margin-top: 10px; font-family: 'Poppins', sans-serif; font-weight: 600; }
        
        /* Scroll Message Style */
        .marquee-container { background: #047857; color: #ccfbf1; padding: 5px 0; font-size: 14px; overflow: hidden; border-radius: 0 0 20px 20px; }
        
        .eng-num { font-family: 'Poppins', sans-serif; }
        .day-cell { height: 75px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; cursor: pointer; position: relative; }
        .today-mark { background: #2563eb !important; color: white !important; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .friday-text { color: #ef4444 !important; }
        
        #detailModal, #adminModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .note-dot { width: 5px; height: 5px; background: #ef4444; border-radius: 50%; position: absolute; bottom: 8px; }
        .menu-dots { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body>

<div class="main-card shadow-lg">
    <div class="header-section">
        <div class="menu-dots" onclick="openAdmin()">⋮</div>
        <h1 class="text-xl font-bold font-[Poppins]">My Smart Calendar</h1>
        <div id="liveTime" class="clock-pill">00:00:00 AM</div>
    </div>

    <div class="marquee-container">
        <marquee id="scrollMsg" behavior="scroll" direction="left">লোড হচ্ছে...</marquee>
    </div>

    <div class="p-6 text-center">
        <h2 id="topDayName" class="text-2xl font-bold text-emerald-800 mb-2">সোম</h2>
        <div id="topEng" class="text-lg font-semibold text-gray-500 eng-num"></div>
        <div id="topHijri" class="text-md font-medium text-emerald-600"></div>
        <div id="topBangla" class="text-md font-medium text-orange-600"></div>
    </div>

    <div class="flex justify-between items-center px-8 py-2">
        <button onclick="changeMonth(-1)" class="text-2xl text-gray-400">❮</button>
        <div id="monthDisplay" class="text-xl font-bold text-slate-800 eng-num"></div>
        <button onclick="changeMonth(1)" class="text-2xl text-gray-400">❯</button>
    </div>

    <div class="grid grid-cols-7 gap-2 px-4 mb-2 text-center text-[10px] font-bold text-gray-400">
        <div>SAT</div><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div class="text-red-400">FRI</div>
    </div>
    <div id="calendarGrid" class="grid grid-cols-7 gap-2 px-4 pb-10"></div>
</div>

<div id="adminModal">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
        <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">অ্যাডমিন প্যানেল</h2>
        <label class="block text-sm font-bold text-gray-500 mb-2">লাইভ স্ক্রল মেসেজ লিখুন:</label>
        <textarea id="adminMsgInput" class="w-full border rounded-xl p-3 h-24 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="এখানে মেসেজ লিখুন..."></textarea>
        <div class="flex gap-3 mt-6">
            <button onclick="saveAdminMsg()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">আপডেট করুন</button>
            <button onclick="closeAdmin()" class="flex-1 bg-gray-100 text-gray-500 py-3 rounded-xl font-bold">বন্ধ</button>
        </div>
    </div>
</div>

<div id="detailModal">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
        <div class="mb-4 border-b pb-3 text-center">
            <h2 id="modalDate" class="text-xl font-bold text-emerald-800 eng-num"></h2>
            <p id="modalDay" class="text-emerald-600 font-bold"></p>
        </div>
        <div class="space-y-2 mb-6 text-center">
            <p id="modalHijri" class="text-gray-700"></p>
            <p id="modalBangla" class="text-gray-700"></p>
        </div>
        <textarea id="noteArea" class="w-full bg-gray-50 border-none rounded-xl p-4 h-28 outline-none" placeholder="নোট লিখুন..."></textarea>
        <div class="flex gap-3 mt-6">
            <button onclick="saveNote()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">সেভ</button>
            <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-500 py-3 rounded-xl font-bold">বন্ধ</button>
        </div>
    </div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = { databaseURL: "YOUR_DATABASE_URL" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDateKey = "";

    // Firebase থেকে লাইভ মেসেজ পড়া
    db.ref('scrollMessage').on('value', (snapshot) => {
        const msg = snapshot.val() || "My Smart Calendar-এ আপনাকে স্বাগতম!";
        document.getElementById('scrollMsg').innerText = msg;
        document.getElementById('adminMsgInput').value = msg;
    });

    function openAdmin() {
        const pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
        if(pass === "1212") {
            document.getElementById('adminModal').style.display = 'flex';
        } else if (pass !== null) {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function saveAdminMsg() {
        const newMsg = document.getElementById('adminMsgInput').value;
        db.ref('scrollMessage').set(newMsg);
        closeAdmin();
    }

    function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

    // ক্যালেন্ডার লজিক
    const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];
    const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        const realToday = new Date();
        grid.innerHTML = '';
        document.getElementById('monthDisplay').innerText = `${engMonths[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const startPos = (firstDay + 1) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const isToday = (dateObj.toDateString() === realToday.toDateString());
            
            let diffDays = Math.floor((dateObj - new Date(2026, 4, 3)) / 86400000);
            let hDate = ((diffDays + 14) % 29 + 29) % 29 || 29;
            let hM = (Math.floor((diffDays + 14) / 29) % 12 + 12) % 12;

            let bDiff = Math.floor((dateObj - new Date(2026, 3, 14)) / 86400000) + 1;
            let bMonthIdx = 0, bDate = bDiff;
            const bLens = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; 
            while(bMonthIdx < 12 && bDate > bLens[bMonthIdx]) { bDate -= bLens[bMonthIdx]; bMonthIdx++; }

            const note = localStorage.getItem(`${year}-${month}-${day}`);
            const dot = note ? '<div class="note-dot"></div>' : '';

            grid.innerHTML += `
                <div class="day-cell ${isToday ? 'today-mark' : ''}" onclick="showDetails(${day}, ${hDate}, '${hijriMonths[hM]}', ${bDate}, '${banglaMonths[bMonthIdx]}', '${dayNamesBn[dateObj.getDay()]}')">
                    <div class="text-lg font-bold eng-num ${dateObj.getDay() === 5 && !isToday ? 'friday-text' : ''}">${day}</div>
                    <div class="text-[10px] eng-num font-semibold opacity-70">${hDate}/${bDate}</div>
                    ${dot}
                </div>
            `;

            if(isToday) updateTopDisplay(day, year, month, hDate, hM, bDate, bMonthIdx, dateObj.getDay());
        }
    }

    function updateTopDisplay(d, y, m, hd, hm, bd, bm, dw) {
        document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dw]}`;
        document.getElementById('topEng').innerText = `${d} ${engMonths[m]} ${y} AD`;
        document.getElementById('topHijri').innerText = `${hd} ${hijriMonths[hm]} 1447 হিজরি`;
        document.getElementById('topBangla').innerText = `${bd} ${banglaMonths[bm]} 1433 বঙ্গাব্দ`;
    }

    function showDetails(day, hDate, hMonth, bDate, bMonth, dayName) {
        selectedDateKey = `${currentYear}-${currentMonth}-${day}`;
        document.getElementById('modalDate').innerText = `${day} ${engMonths[currentMonth]} ${currentYear}`;
        document.getElementById('modalDay').innerText = dayName;
        document.getElementById('modalHijri').innerText = `🌙 হিজরি: ${hDate} ${hMonth} 1447`;
        document.getElementById('modalBangla').innerText = `🌾 বাংলা: ${bDate} ${bMonth} 1433`;
        document.getElementById('noteArea').value = localStorage.getItem(selectedDateKey) || "";
        document.getElementById('detailModal').style.display = 'flex';
    }

    function saveNote() {
        const note = document.getElementById('noteArea').value;
        if(note.trim()) localStorage.setItem(selectedDateKey, note);
        else localStorage.removeItem(selectedDateKey);
        closeModal();
        renderCalendar(currentYear, currentMonth);
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    function changeMonth(s) { currentMonth += s; if(currentMonth>11){currentMonth=0;currentYear++;} else if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(currentYear, currentMonth); }
    
    setInterval(() => { document.getElementById('liveTime').innerText = new Date().toLocaleTimeString('en-US', { hour12: true }); }, 1000);
    renderCalendar(currentYear, currentMonth);
</script>
</body>
</html>
