<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        .header-section { background-color: #059669; padding: 25px; text-align: center; color: white; border-radius: 0 0 25px 25px; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 8px 30px; border-radius: 50px; font-size: 22px; margin-top: 15px; font-family: 'Poppins', sans-serif; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 0 15px; }
        .day-cell { height: 65px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; }
        .today-mark { background: #2563eb !important; color: white !important; }
        .today-mark * { color: white !important; }
    </style>
</head>
<body>

    <div class="main-card shadow-lg">
        <div class="header-section">
            <h1 class="text-2xl font-bold">My Smart Calendar</h1>
            <div id="liveTime" class="clock-pill">00:00:00 AM</div>
        </div>

        <div class="p-8 text-center border-bottom border-gray-100 min-h-[220px]">
            <h2 id="topDayName" class="text-2xl font-bold text-emerald-800 mb-4">লোড হচ্ছে...</h2>
            <div id="topEng" class="text-xl font-semibold text-gray-700 mb-2"></div>
            <div id="topHijri" class="text-xl font-semibold text-gray-700 mb-2"></div>
            <div id="topBangla" class="text-xl font-semibold text-gray-700"></div>
        </div>

        <div class="flex justify-between items-center p-5">
            <button class="text-2xl font-bold p-3" onclick="changeMonth(-1)">❮</button>
            <div id="monthDisplay" class="text-2xl font-bold text-gray-800"></div>
            <button class="text-2xl font-bold p-3" onclick="changeMonth(1)">❯</button>
        </div>

        <div class="grid-7 mb-4">
            <div class="text-center font-bold text-gray-400">Sat</div>
            <div class="text-center font-bold text-gray-400">Sun</div>
            <div class="text-center font-bold text-gray-400">Mon</div>
            <div class="text-center font-bold text-gray-400">Tue</div>
            <div class="text-center font-bold text-gray-400">Wed</div>
            <div class="text-center font-bold text-gray-400">Thu</div>
            <div class="text-center font-bold text-red-500">Fri</div>
        </div>

        <div id="calendarGrid" class="grid-7"></div>
    </div>

    <script>
        // Firebase initialization (আপনার URL টি এখানে দিন)
        const firebaseConfig = { databaseURL: "https://YOUR_DATABASE_URL.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentYear = 2026;
        let currentMonth = 4; // May
        let hijriAdj = 0;

        const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
        const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
        const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

        db.ref('hijriAdj').on('value', (snapshot) => {
            hijriAdj = snapshot.val() || 0;
            renderCalendar();
        });

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            if(!grid) return;
            grid.innerHTML = '';
            document.getElementById('monthDisplay').innerText = `${engMonths[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const startPos = (firstDay + 1) % 7;
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

            const baseDate = new Date(2026, 4, 3); // বেস তারিখ: ৩ মে ২০২৬ (১৪ যিলক্বদ)

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(currentYear, currentMonth, day);
                const diff = Math.round((dateObj - baseDate) / (1000*60*60*24));
                
                // আরবি ক্যালকুলেশন
                let hTotalDays = diff + 14; 
                let hDay = ((hTotalDays % 29) + 29) % 29;
                if(hDay === 0) hDay = 29;

                let hMonthIdx = (Math.floor(hTotalDays / 29) % 12 + 12) % 12;

                // আপনার কন্ডিশন: +১ অ্যাডজাস্টমেন্টে ১ তারিখ হবে ৩০
                let finalHDay = hDay;
                let finalHMonthIdx = hMonthIdx;

                if (hijriAdj > 0 && hDay === 1) {
                    finalHDay = 30;
                    finalHMonthIdx = (hMonthIdx - 1 + 12) % 12;
                }

                // বাংলা ক্যালকুলেশন
                let bTotalDays = Math.round((dateObj - new Date(2026, 3, 14)) / (1000*60*60*24)) + 1;
                let bMonthIdx = 0;
                let bDate = bTotalDays;
                const bDays = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30];
                for(let m=0; m<12; m++) {
                    if(bDate <= bDays[m]) { bMonthIdx = m; break; }
                    bDate -= bDays[m];
                }

                const isToday = (dateObj.toDateString() === new Date().toDateString());

                grid.innerHTML += `
                    <div class="day-cell ${isToday ? 'today-mark' : ''}">
                        <div class="text-xl font-bold">${day}</div>
                        <div class="text-[10px] font-semibold">${finalHDay}/${bDate}</div>
                    </div>
                `;

                if(isToday) {
                    document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dateObj.getDay()]}`;
                    document.getElementById('topEng').innerText = `${day} ${engMonths[currentMonth]} ${currentYear} AD`;
                    document.getElementById('topHijri').innerText = `${finalHDay} ${hijriMonths[finalHMonthIdx]} 1447 হিজরি`;
                    document.getElementById('topBangla').innerText = `${bDate} ${banglaMonths[bMonthIdx]} 1433 বঙ্গাব্দ`;
                }
            }
        }

        function changeMonth(s) {
            currentMonth += s;
            if(currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if(currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        setInterval(() => {
            document.getElementById('liveTime').innerText = new Date().toLocaleTimeString('en-US', { hour12: true });
        }, 1000);
    </script>
</body>
</html>
