<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .header-area { background-color: #059669; padding: 30px 20px; text-align: center; color: white; border-radius: 0 0 25px 25px; }
        .clock-display { background: rgba(255,255,255,0.2); display: inline-block; padding: 10px 35px; border-radius: 50px; font-size: 26px; font-weight: bold; margin-top: 15px; font-family: 'Poppins', sans-serif; }
        .date-container { padding: 30px 20px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .date-line { font-size: 21px; font-weight: 600; color: #374151; margin: 12px 0; }
        .highlight-month { background-color: #fef08a; padding: 2px 8px; border-radius: 6px; color: #166534; font-weight: 700; }
        .month-title { font-size: 34px; font-weight: 800; color: #1f2937; text-align: center; margin-top: 25px; font-family: 'Poppins', sans-serif; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 0 15px; }
        .day-head { text-align: center; font-weight: bold; font-size: 15px; color: #9ca3af; padding-bottom: 12px; }
        .calendar-cell { height: 70px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f9fafb; border-radius: 15px; border: 1px solid #f1f5f9; }
        .num-eng { font-size: 22px; font-weight: 700; color: #111827; }
        .num-sub { font-size: 11px; color: #6b7280; font-weight: 600; margin-top: 3px; }
        .today-active { background: #2563eb !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
        .today-active * { color: white !important; }
        .holiday { color: #ef4444 !important; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header-area">
            <h1 class="text-3xl font-bold tracking-tight" style="font-family: 'Poppins', sans-serif;">My Smart Calendar</h1>
            <div id="realtimeClock" class="clock-display">00:00:00 AM</div>
        </div>

        <div class="date-container">
            <h2 class="text-3xl font-bold text-emerald-700 mb-5">আজ রবিবার</h2>
            <div class="date-line">০৩ মে ২০২৬ খ্রিষ্টাব্দ</div>
            <div class="date-line"><span class="highlight-month">১৪ যিলক্বদ</span> ১৪৪৭ হিজরি</div>
            <div class="date-line"><span class="highlight-month">২০ বৈশাখ</span> ১৪৩৩ বঙ্গাব্দ</div>
        </div>

        <div class="pb-10">
            <div class="month-title">MAY 2026</div>
            <div class="flex justify-between px-6 text-sm font-bold text-slate-500 border-b mx-4 mb-4 pb-2">
                <span class="highlight-month">যিলকদ - যিলহজ্ব</span>
                <span class="highlight-month">বৈশাখ - জ্যৈষ্ঠ</span>
            </div>

            <div class="grid-7 mb-2">
                <div class="day-head">শনি</div><div class="day-head">রবি</div><div class="day-head">সোম</div>
                <div class="day-head">মঙ্গল</div><div class="day-head">বুধ</div><div class="day-head">বৃহ</div>
                <div class="day-head holiday">শুক্র</div>
            </div>

            <div id="calGrid" class="grid-7">
                </div>
        </div>
    </div>

    <script>
        const toBengali = n => n.toString().replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);

        function createCalendar() {
            const grid = document.getElementById('calGrid');
            const totalDays = 31;
            const offset = 6; // মে ২০২৬ শুরু হচ্ছে শনিবার থেকে

            // প্রথম দিকের খালি ঘর
            for(let i=0; i<offset; i++) {
                grid.innerHTML += '<div></div>';
            }

            for(let d=1; d<=totalDays; d++) {
                const isToday = (d === 3);
                const isFriday = ((d + offset) % 7 === 0);
                
                // তারিখের হিসাব
                const hijriDate = d + 13;
                const banglaDate = (d + 17) > 31 ? (d + 17 - 31) : (d + 17);

                grid.innerHTML += `
                    <div class="calendar-cell ${isToday ? 'today-active' : ''}">
                        <div class="num-eng ${isFriday && !isToday ? 'holiday' : ''}">${toBengali(d)}</div>
                        <div class="num-sub">${toBengali(hijriDate)}/${toBengali(banglaDate)}</div>
                    </div>
                `;
            }
        }

        function runClock() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('realtimeClock').innerText = now.toLocaleTimeString('en-US', options);
        }

        setInterval(runClock, 1000);
        runClock();
        createCalendar();
    </script>
</body>
</html>
