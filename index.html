<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; }
        .header-section { background-color: #059669; padding: 25px; text-align: center; color: white; border-radius: 0 0 25px 25px; }
        .title-text { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 8px 30px; border-radius: 50px; font-size: 22px; margin-top: 15px; font-family: 'Poppins', sans-serif; font-weight: 600; }
        .date-display { padding: 30px 20px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .date-row { font-size: 20px; font-weight: 600; color: #334155; margin: 10px 0; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .month-label { font-size: 28px; font-weight: 700; color: #1e293b; font-family: 'Poppins', sans-serif; }
        .nav-btn { background: #f8fafc; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: #e2e8f0; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 0 15px; }
        .weekday { text-align: center; font-weight: bold; font-size: 14px; color: #94a3b8; padding-bottom: 15px; }
        .day-cell { height: 65px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; }
        .num-main { font-size: 20px; font-weight: 700; color: #1e293b; font-family: 'Poppins', sans-serif; }
        .num-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
        .today-mark { background: #2563eb !important; border: none; }
        .today-mark * { color: white !important; }
        .friday-text { color: #ef4444 !important; }
    </style>
</head>
<body>

    <div class="main-card shadow-lg">
        <div class="header-section">
            <h1 class="title-text">My Smart Calendar</h1>
            <div id="liveTime" class="clock-pill">00:00:00 AM</div>
        </div>

        <div class="date-display">
            <h2 class="text-2xl font-bold text-emerald-800 mb-4">আজ রবিবার</h2>
            <div class="date-row">০৩ মে ২০২৬ খ্রিষ্টাব্দ</div>
            <div class="date-row">১৪ যিলক্বদ ১৪৪৭ হিজরি</div>
            <div class="date-row">২০ বৈশাখ ১৪৩৩ বঙ্গাব্দ</div>
        </div>

        <div class="calendar-nav">
            <button class="nav-btn">&lt;</button>
            <div class="month-label">May 2026</div>
            <button class="nav-btn">&gt;</button>
        </div>

        <div class="grid-7">
            <div class="weekday">Sat</div><div class="weekday">Sun</div><div class="weekday">Mon</div>
            <div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div>
            <div class="weekday friday-text">Fri</div>
        </div>

        <div class="grid-7 pb-10">
            <div class="day-cell"><div class="num-main">1</div><div class="num-sub">12/18</div></div>
            <div class="day-cell"><div class="num-main">2</div><div class="num-sub">13/19</div></div>
            <div class="day-cell today-mark"><div class="num-main">3</div><div class="num-sub">14/20</div></div>
            <div class="day-cell"><div class="num-main">4</div><div class="num-sub">15/21</div></div>
            <div class="day-cell"><div class="num-main">5</div><div class="num-sub">16/22</div></div>
            <div class="day-cell"><div class="num-main">6</div><div class="num-sub">17/23</div></div>
            <div class="day-cell friday-text"><div class="num-main">7</div><div class="num-sub">18/24</div></div>
            
            <div class="day-cell"><div class="num-main">8</div><div class="num-sub">19/25</div></div>
            <div class="day-cell"><div class="num-main">9</div><div class="num-sub">20/26</div></div>
            <div class="day-cell"><div class="num-main">10</div><div class="num-sub">21/27</div></div>
            <div class="day-cell"><div class="num-main">11</div><div class="num-sub">22/28</div></div>
            <div class="day-cell"><div class="num-main">12</div><div class="num-sub">23/29</div></div>
            <div class="day-cell"><div class="num-main">13</div><div class="num-sub">24/30</div></div>
            <div class="day-cell friday-text"><div class="num-main">14</div><div class="num-sub">25/1</div></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: true });
            document.getElementById('liveTime').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
