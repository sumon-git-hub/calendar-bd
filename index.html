<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট ক্যালেন্ডার ও ব্যাকআপ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-2 md:p-6">

    <div class="max-w-4xl mx-auto space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap justify-between items-center border">
            <div id="userIn" class="hidden flex items-center gap-2">
                <span id="uMail" class="text-green-600 font-bold text-sm"></span>
                <button onclick="logout()" class="text-xs bg-red-50 text-red-600 px-2 py-1 rounded">লগআউট</button>
            </div>
            <div id="userOut" class="flex gap-2">
                <input id="email" type="email" placeholder="ইমেল" class="border p-1 rounded text-sm w-24 md:w-40">
                <input id="pass" type="password" placeholder="পাসওয়ার্ড" class="border p-1 rounded text-sm w-24 md:w-40">
                <button onclick="login()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm font-bold">লগইন</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="font-bold mb-3">🎂 বয়স ও প্রিয়জন</h2>
                <input type="date" id="dob" class="w-full border p-2 rounded mb-2 outline-none">
                <div class="flex gap-2">
                    <button onclick="saveAge()" class="flex-1 bg-green-600 text-white py-2 rounded font-bold text-sm">নাম দিয়ে সেভ করুন</button>
                </div>
                <div id="savedList" class="mt-4 space-y-2"></div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)">❮</button>
                    <h2 id="mLabel" class="font-bold text-lg"></h2>
                    <button onclick="changeMonth(1)">❯</button>
                </div>
                <div id="calGrid" class="grid grid-cols-7 gap-1 text-center text-[10px] md:text-xs"></div>
            </div>
        </div>
    </div>

    <script>
        // আপনার স্ক্রিনশট অনুযায়ী কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyCB11BEwTE9xjHLACIN...", // এখানে আপনার পুরো API Key-টি বসবে
            authDomain: "mysmartcalender-4219a.firebaseapp.com",
            projectId: "mysmartcalender-4219a",
            storageBucket: "mysmartcalender-4219a.appspot.com",
            messagingSenderId: "123456789", // আপনার স্ক্রিনশট থেকে বসিয়ে নিন
            appId: "1:..." // আপনার স্ক্রিনশট থেকে বসিয়ে নিন
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // সহজ লগইন/রেজিস্ট্রেশন
        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(() => auth.createUserWithEmailAndPassword(e, p))
            .then(() => alert("সফল!")).catch(err => alert("ইমেল ও পাসওয়ার্ড ঠিকভাবে দিন (কমপক্ষে ৬ অক্ষর)"));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        let savedPeople = [];
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('userOut').classList.add('hidden');
                document.getElementById('userIn').classList.remove('hidden');
                document.getElementById('uMail').innerText = user.email;
                db.collection("data").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) { savedPeople = doc.data().list || []; showList(); }
                });
            }
        });

        function saveAge() {
            const dob = document.getElementById('dob').value;
            const name = prompt("কার বয়স? নাম লিখুন:");
            if (!dob || !name) return;
            savedPeople.push({ name, dob, id: Date.now() });
            if (auth.currentUser) db.collection("data").doc(auth.currentUser.uid).set({ list: savedPeople });
            else showList();
        }

        function showList() {
            const div = document.getElementById('savedList');
            div.innerHTML = savedPeople.map(p => `
                <div class="flex justify-between p-2 bg-gray-50 border rounded text-sm italic">
                    <span><b>${p.name}</b> (${p.dob})</span>
                    <button onclick="del('${p.id}')" class="text-red-500 font-bold">X</button>
                </div>
            `).join('');
        }

        function del(id) {
            savedPeople = savedPeople.filter(p => p.id != id);
            if (auth.currentUser) db.collection("data").doc(auth.currentUser.uid).set({ list: savedPeople });
            else showList();
        }

        // ক্যালেন্ডার লজিক
        let curM = new Date().getMonth(), curY = new Date().getFullYear();
        function render() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '<div>শ</div><div>র</div><div>স</div><div>ম</div><div>বু</div><div>বৃ</div><div>শু</div>';
            const days = new Date(curY, curM + 1, 0).getDate();
            const first = (new Date(curY, curM, 1).getDay() + 1) % 7;
            document.getElementById('mLabel').innerText = new Intl.DateTimeFormat('bn-BD', {month:'long', year:'numeric'}).format(new Date(curY, curM));
            for(let i=0; i<first; i++) grid.innerHTML += '<div></div>';
            for(let d=1; d<=days; d++) grid.innerHTML += `<div class="border p-1 bg-white rounded">${d}</div>`;
        }
        function changeMonth(s) { curM += s; render(); }
        render();
    </script>
</body>
</html>
