<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        
        /* Modern Gradient Header */
        .header-section { background: linear-gradient(135deg, #059669 0%, #047857 100%); padding: 30px 20px 20px 20px; text-align: center; color: white; border-radius: 0 0 40px 40px; position: relative; box-shadow: 0 10px 20px rgba(5, 150, 105, 0.1); }
        .clock-pill { background: rgba(255,255,255,0.12); display: inline-block; padding: 10px 35px; border-radius: 20px; font-size: 24px; margin-top: 10px; font-family: 'Poppins', sans-serif; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        
        /* Subtle Floating Marquee */
        .marquee-container { width: 80%; margin: 12px auto 0; overflow: hidden; white-space: nowrap; font-size: 13px; opacity: 0.9; color: #ecfdf5; font-weight: 500; }

        .eng-num { font-family: 'Poppins', sans-serif; }
        .day-cell { height: 75px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #ffffff; border-radius: 18px; border: 1px solid #f1f5f9; cursor: pointer; transition: 0.2s; position: relative; }
        .today-mark { background: #2563eb !important; color: white !important; border: none; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); transform: scale(1.02); }
        .friday-text { color: #ef4444 !important; font-weight: 700; }
        
        .note-indicator { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; position: absolute; bottom: 8px; }
        .menu-icon { position: absolute; top: 25px; right: 25px; cursor: pointer; padding: 6px; background: rgba(255,255,255,0.15); border-radius: 12px; }

        #detailModal, #adminModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-box { background: white; width: 100%; max-width: 380px; border-radius: 30px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header-section">
        <div class="menu-icon" onclick="openAdmin()">
            <svg width="22" height="22" fill="white" viewBox="0 0 16 16"><path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>
        </div>
        <h1 class="text-xs font-bold font-[Poppins] opacity-60 uppercase tracking-[0.2em]">My Smart Calendar</h1>
        <div id="liveTime" class="clock-pill">00:00:00 AM</div>
        
        <div class="marquee-container">
            <marquee id="scrollText" behavior="scroll" direction="left" scrollamount="4">My Smart Calendar-এ আপনাকে স্বাগতম!</marquee>
        </div>
    </div>

    <div class="pt-8 pb-6 px-4 text-center">
        <h2 id="topDayName" class="text-3xl font-bold text-slate-800 mb-1">...</h2>
        <p id="topEng" class="text-lg font-semibold text-slate-400 mb-5 eng-num"></p>
        <div class="flex justify-center gap-3">
            <div class="bg-emerald-50 px-4 py-2 rounded-2xl border border-emerald-100">
                <p id="topHijri" class="text-emerald-700 font-bold text-sm"></p>
            </div>
            <div class="bg-orange-50 px-4 py-2 rounded-2xl border border-orange-100">
                <p id="topBangla" class="text-orange-700 font-bold text-sm"></p>
            </div>
        </div>
    </div>

    <div class="flex justify-between items-center px-10 mb-6">
        <button onclick="changeMonth(-1)" class="p-2 text-slate-300 hover:text-emerald-600 transition">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div id="monthDisplay" class="text-2xl font-bold text-slate-800 eng-num"></div>
        <button onclick="changeMonth(1)" class="p-2 text-slate-300 hover:text-emerald-600 transition">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5l6 6-6 6"></path></svg>
        </button>
    </div>

    <div class="grid grid-cols-7 gap-3 px-6 mb-3 text-center text-[11px] font-bold text-slate-400 uppercase tracking-widest">
        <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-400">Fri</div>
    </div>
    <div id="calendarGrid" class="grid grid-cols-7 gap-3 px-6 pb-12"></div>
</div>

<div id="adminModal">
    <div class="modal-box">
        <h2 class="text-2xl font-bold mb-6 text-slate-800">সেটিংস</h2>
        <label class="block text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">স্ক্রল মেসেজ</label>
        <textarea id="adminMsgInput" class="w-full bg-slate-50 border-none rounded-2xl p-4 h-24 outline-none focus:ring-2 focus:ring-emerald-500 mb-6 text-slate-700" placeholder="নতুন মেসেজ লিখুন..."></textarea>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="saveAdminMsg()" class="bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-100">সেভ</button>
            <button onclick="closeAdmin()" class="bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">বন্ধ</button>
        </div>
    </div>
</div>

<div id="detailModal">
    <div class="modal-box">
        <div class="text-center mb-6">
            <h2 id="modalDate" class="text-2xl font-bold text-slate-800 eng-num"></h2>
            <p id="modalDay" class="text-emerald-600 font-bold text-lg mt-1"></p>
        </div>
        <div class="bg-slate-50 p-5 rounded-2xl space-y-3 mb-6 border border-slate-100">
            <p id="modalHijri" class="text-slate-700 font-medium flex items-center gap-2">🌙 <span></span></p>
            <p id="modalBangla" class="text-slate-700 font-medium flex items-center gap-2">🌾 <span></span></p>
        </div>
        <textarea id="noteArea" class="w-full border-2 border-slate-100 rounded-2xl p-4 h-28 outline-none focus:border-emerald-500 transition" placeholder="নোট লিখুন..."></textarea>
        <div class="grid grid-cols-2 gap-4 mt-6">
            <button onclick="saveNote()" class="bg-emerald-600 text-white py-4 rounded-2xl font-bold">সেভ করুন</button>
            <button onclick="closeModal()" class="bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">বন্ধ</button>
        </div>
    </div>
</div>

<script>
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDateKey = "";

    const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];
    const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function openAdmin() {
        if (prompt("পাসওয়ার্ড দিন:") === "1212") document.getElementById('adminModal').style.display = 'flex';
        else alert("ভুল পাসওয়ার্ড!");
    }
    function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
    function saveAdminMsg() {
        const msg = document.getElementById('adminMsgInput').value;
        if(msg.trim()) {
            document.getElementById('scrollText').innerText = msg;
            localStorage.setItem('savedScrollMsg', msg);
        }
        closeAdmin();
    }

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        const realToday = new Date();
        grid.innerHTML = '';
        document.getElementById('monthDisplay').innerText = `${engMonths[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const startPos = (firstDay + 1) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const isToday = (dateObj.toDateString() === realToday.toDateString());
            
            let diffDays = Math.floor((dateObj - new Date(2026, 4, 3)) / 86400000);
            let hDate = ((diffDays + 14) % 29 + 29) % 29 || 29;
            let hM = (Math.floor((diffDays + 14) / 29) % 12 + 12) % 12;

            let bDiff = Math.floor((dateObj - new Date(2026, 3, 14)) / 86400000) + 1;
            let bMonthIdx = 0, bDate = bDiff;
            const bLens = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; 
            while(bMonthIdx < 12 && bDate > bLens[bMonthIdx]) { bDate -= bLens[bMonthIdx]; bMonthIdx++; }

            const note = localStorage.getItem(`${year}-${month}-${day}`);

            grid.innerHTML += `
                <div class="day-cell ${isToday ? 'today-mark' : ''}" onclick="showDetails(${day}, ${hDate}, '${hijriMonths[hM]}', ${bDate}, '${banglaMonths[bMonthIdx]}', '${dayNamesBn[dateObj.getDay()]}')">
                    <div class="text-xl font-bold eng-num ${dateObj.getDay() === 5 && !isToday ? 'friday-text' : ''}">${day}</div>
                    <div class="text-[10px] font-bold opacity-50 eng-num">${hDate}/${bDate}</div>
                    ${note ? '<div class="note-indicator"></div>' : ''}
                </div>
            `;

            if(isToday) {
                document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dateObj.getDay()]}`;
                document.getElementById('topEng').innerText = `${day} ${engMonths[month]} ${year} AD`;
                document.getElementById('topHijri').innerText = `${hDate} ${hijriMonths[hM]} 1447 হিজরি`;
                document.getElementById('topBangla').innerText = `${bDate} ${banglaMonths[bMonthIdx]} 1433 বঙ্গাব্দ`;
            }
        }
    }

    function showDetails(day, hDate, hMonth, bDate, bMonth, dayName) {
        selectedDateKey = `${currentYear}-${currentMonth}-${day}`;
        document.getElementById('modalDate').innerText = `${day} ${engMonths[currentMonth]} ${currentYear}`;
        document.getElementById('modalDay').innerText = dayName;
        document.querySelector('#modalHijri span').innerText = `হিজরি: ${hDate} ${hMonth} 1447`;
        document.querySelector('#modalBangla span').innerText = `বাংলা: ${bDate} ${bMonth} 1433`;
        document.getElementById('noteArea').value = localStorage.getItem(selectedDateKey) || "";
        document.getElementById('detailModal').style.display = 'flex';
    }

    function saveNote() {
        localStorage.setItem(selectedDateKey, document.getElementById('noteArea').value);
        closeModal();
        renderCalendar(currentYear, currentMonth);
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    function changeMonth(s) { currentMonth += s; if(currentMonth>11){currentMonth=0;currentYear++;} else if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(currentYear, currentMonth); }

    const savedMsg = localStorage.getItem('savedScrollMsg');
    if(savedMsg) document.getElementById('scrollText').innerText = savedMsg;
    
    setInterval(() => {
        document.getElementById('liveTime').innerText = new Date().toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }, 1000);

    renderCalendar(currentYear, currentMonth);
</script>
</body>
</html>
