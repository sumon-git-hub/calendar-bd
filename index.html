<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; overflow: hidden; }
        .header-section { background-color: #059669; padding: 25px; text-align: center; color: white; border-radius: 0 0 25px 25px; position: relative; }
        .title-text { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 8px 30px; border-radius: 50px; font-size: 22px; margin-top: 15px; font-family: 'Poppins', sans-serif; font-weight: 600; }
        .menu-btn { position: absolute; top: 25px; right: 20px; cursor: pointer; font-size: 24px; color: white; }
        .admin-dropdown { display: none; position: absolute; top: 60px; right: 20px; background: #1e293b; color: white; padding: 15px; border-radius: 12px; z-index: 50; width: 160px; box-shadow: 0 10px 15px rgba(0,0,0,0.2); }
        .date-display { padding: 30px 20px; text-align: center; border-bottom: 1px solid #f1f5f9; min-height: 180px; }
        .date-row { font-size: 20px; font-weight: 600; color: #334155; margin: 10px 0; }
        .eng-num { font-family: 'Poppins', sans-serif; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .month-label { font-size: 26px; font-weight: 700; color: #1e293b; font-family: 'Poppins', sans-serif; min-width: 180px; text-align: center; }
        .nav-btn { background: #f8fafc; border: 1px solid #e2e8f0; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 20px; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 0 15px; }
        .weekday { text-align: center; font-weight: bold; font-size: 14px; color: #94a3b8; padding-bottom: 15px; font-family: 'Poppins', sans-serif; }
        .day-cell { height: 65px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; }
        .num-main { font-size: 19px; font-weight: 700; color: #1e293b; font-family: 'Poppins', sans-serif; }
        .num-sub { font-size: 10px; color: #64748b; margin-top: 2px; font-family: 'Poppins', sans-serif; }
        .today-mark { background: #2563eb !important; border: none; }
        .today-mark * { color: white !important; }
        .friday-text { color: #ef4444 !important; }
        .red-star { color: #ef4444; font-weight: bold; }
        .footer-note { text-align: center; color: #ef4444; font-weight: 600; font-size: 14px; padding: 20px 10px; }
    </style>
</head>
<body>

    <div class="main-card shadow-lg">
        <div class="header-section">
            <div class="menu-btn" onclick="checkAdmin()">⋮</div>
            <div id="adminPanel" class="admin-dropdown">
                <h3 class="text-xs font-bold mb-2 text-yellow-400">অ্যাডমিন কন্ট্রোল</h3>
                <div class="flex items-center justify-between gap-2">
                    <button onclick="adjustHijri(-1, event)" class="bg-red-500 w-8 h-8 rounded">-</button>
                    <span id="adjVal" class="font-bold eng-num">0</span>
                    <button onclick="adjustHijri(1, event)" class="bg-emerald-500 w-8 h-8 rounded">+</button>
                </div>
                <button onclick="logoutAdmin()" class="mt-3 text-[10px] text-gray-400 underline">লগ আউট</button>
            </div>
            <h1 class="title-text">My Smart Calendar</h1>
            <div id="liveTime" class="clock-pill">00:00:00 AM</div>
        </div>

        <div class="date-display">
            <h2 id="topDayName" class="text-2xl font-bold text-emerald-800 mb-4">আজ রবিবার</h2>
            <div id="topEng" class="date-row eng-num"></div>
            <div id="topHijri" class="date-row"></div>
            <div id="topBangla" class="date-row"></div>
        </div>

        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
            <div id="monthDisplay" class="month-label"></div>
            <button class="nav-btn" onclick="changeMonth(1)">❯</button>
        </div>

        <div class="grid-7">
            <div class="weekday">Sat</div><div class="weekday">Sun</div><div class="weekday">Mon</div>
            <div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div>
            <div class="weekday friday-text">Fri</div>
        </div>

        <div id="calendarGrid" class="grid-7"></div>
        <div class="footer-note">* আরবি তারিখ চাঁদ দেখার উপর নির্ভরশীল</div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://YOUR_DATABASE_URL.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentYear = 2026;
        let currentMonth = 4; // May
        let hijriAdjustment = 0;
        let isAdmin = false;

        const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
        const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
        const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

        db.ref('hijriAdj').on('value', (snapshot) => {
            hijriAdjustment = snapshot.val() || 0;
            renderCalendar(currentYear, currentMonth);
        });

        function checkAdmin() {
            if(isAdmin) togglePanel();
            else {
                let pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
                if(pass === "AmiSumon1") { isAdmin = true; togglePanel(); }
                else alert("ভুল পাসওয়ার্ড!");
            }
        }

        function togglePanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function logoutAdmin() { isAdmin = false; document.getElementById('adminPanel').style.display = 'none'; }
        function adjustHijri(val, e) { e.stopPropagation(); hijriAdjustment += val; db.ref('hijriAdj').set(hijriAdjustment); }

        function renderCalendar(year, month) {
            const grid = document.getElementById('calendarGrid');
            if(!grid) return;
            grid.innerHTML = '';
            document.getElementById('monthDisplay').innerText = `${engMonths[month]} ${year}`;
            document.getElementById('adjVal').innerText = hijriAdjustment;

            const firstDay = new Date(year, month, 1).getDay();
            const startPos = (firstDay + 1) % 7; 
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

            const baseDate = new Date(2026, 4, 3); // বেস ডেট
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const diffDays = Math.floor((dateObj - baseDate) / (1000*60*60*24));
                
                // আরবি লজিক ফিক্স
                let totalH = diffDays + 14 + hijriAdjustment;
                let hMonthIdx = 0;
                
                // বেস সাইকেল ২৯ দিনের
                while (totalH > 29) { totalH -= 29; hMonthIdx = (hMonthIdx + 1) % 12; }
                while (totalH <= 0) { hMonthIdx = (hMonthIdx - 1 + 12) % 12; totalH += 29; }

                let finalHDate = totalH;
                let finalHMonthIdx = hMonthIdx;

                // সুমন ভাইয়ের কন্ডিশন: ১ তারিখ ৩০ হবে যদি অ্যাডজাস্টমেন্ট থাকে
                if (hijriAdjustment > 0 && totalH === 1) {
                    finalHDate = 30;
                    finalHMonthIdx = (hMonthIdx - 1 + 12) % 12;
                }

                // বাংলা ক্যালকুলেশন
                let bTotalDays = Math.floor((dateObj - new Date(2026, 3, 14)) / (1000*60*60*24)) + 1;
                let bMonthIdx = 0;
                let bDate = bTotalDays;
                const bDaysInMonth = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; 
                while(bDate > bDaysInMonth[bMonthIdx]) { bDate -= bDaysInMonth[bMonthIdx]; bMonthIdx = (bMonthIdx + 1) % 12; }

                const isToday = (dateObj.toDateString() === new Date().toDateString());

                grid.innerHTML += `
                    <div class="day-cell ${isToday ? 'today-mark' : ''}">
                        <div class="num-main ${dateObj.getDay() === 5 && !isToday ? 'friday-text' : ''}">${day}</div>
                        <div class="num-sub">${finalHDate}/${bDate}</div>
                    </div>
                `;

                if(isToday) {
                    document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dateObj.getDay()]}`;
                    document.getElementById('topEng').innerText = `${day} ${engMonths[month]} ${year} AD`;
                    document.getElementById('topHijri').innerHTML = `${finalHDate} ${hijriMonths[finalHMonthIdx]} <span class="eng-num">1447</span> হিজরি`;
                    document.getElementById('topBangla').innerHTML = `${bDate} ${banglaMonths[bMonthIdx]} <span class="eng-num">1433</span> বঙ্গাব্দ`;
                }
            }
        }

        function changeMonth(step) {
            currentMonth += step;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        }
        function updateClock() { 
            const el = document.getElementById('liveTime');
            if(el) el.innerText = new Date().toLocaleTimeString('en-US', { hour12: true }); 
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
