<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম হিজরি ক্যালেন্ডার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        .calendar-table { width: 100%; border-collapse: collapse; background: white; }
        .calendar-table th, .calendar-table td { border: 1px solid #d1d5db; padding: 8px; text-align: center; }
        .calendar-table th { background-color: #f9fafb; color: #374151; font-weight: bold; }
        .hijri-main { font-size: 1.8rem; font-weight: 700; color: #dc2626; line-height: 1; }
        .sub-dates { font-size: 0.75rem; font-weight: 600; color: #1f2937; margin-top: 4px; }
        .header-box { border: 2px solid #374151; border-radius: 8px; margin-bottom: 10px; }
        .admin-panel { background: #1e293b; color: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-3xl mx-auto">
        
        <div id="adminPanel" class="hidden admin-panel shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-amber-400 font-bold">হিজরি তারিখ সমন্বয় (এডমিন)</h3>
                <div class="flex items-center gap-4 bg-slate-700 p-2 rounded-lg">
                    <button onclick="updateAdj(-1)" class="px-4 py-1 bg-red-600 rounded-md font-bold">-১</button>
                    <span id="adjVal" class="text-xl font-bold">০</span>
                    <button onclick="updateAdj(1)" class="px-4 py-1 bg-green-600 rounded-md font-bold">+১</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-t-xl border-t-2 border-x-2 border-gray-300">
            <h1 class="text-2xl md:text-3xl text-center font-bold text-gray-800 border-b-2 border-gray-800 pb-2 mb-4">হিজরি ক্যালেন্ডার ১৪৪৭ হিজরি</h1>
            
            <div class="grid grid-cols-3 gap-2 text-center font-bold text-sm md:text-base">
                <div class="border-2 border-gray-800 rounded p-1">May 2026</div>
                <div class="border-2 border-red-600 text-red-600 rounded p-1">জিলকদ ১৪৪৭ হিজরি</div>
                <div class="border-2 border-gray-800 rounded p-1">বৈশাখ-জ্যৈষ্ঠ ১৪৩৩</div>
            </div>
        </div>

        <table class="calendar-table shadow-lg">
            <thead>
                <tr>
                    <th>শনি</th><th>রবি</th><th>সোম</th><th>মঙ্গল</th><th>বুধ</th><th>বৃহঃ</th><th class="bg-yellow-200 text-red-600">শুক্র</th>
                </tr>
            </thead>
            <tbody id="calendarBody">
                </tbody>
        </table>

        <div class="mt-4 text-center text-red-600 font-bold text-sm bg-white p-3 border-2 border-dashed border-red-300 rounded-lg">
            * আরবি মাস চাঁদ দেখার উপর নির্ভরশীল।
        </div>
    </div>

    <script>
        // Firebase Config (আপনারটা বসাবেন)
        const firebaseConfig = { apiKey: "...", projectId: "...", appId: "..." };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const toBn = n => n.toString().replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
        let adjustment = 0;

        // এডমিন চেক
        firebase.auth().onAuthStateChanged(user => {
            if (user && user.email === 'admin@gmail.com') document.getElementById('adminPanel').classList.remove('hidden');
        });

        // হিজরি আপডেট রিয়েল-টাইম
        db.collection('settings').doc('hijri').onSnapshot(doc => {
            adjustment = doc.exists ? doc.data().value : 0;
            document.getElementById('adjVal').innerText = toBn(adjustment);
            render();
        });

        function updateAdj(v) {
            db.collection('settings').doc('hijri').set({ value: adjustment + v });
        }

        function render() {
            const body = document.getElementById('calendarBody');
            body.innerHTML = '';
            let date = 1;
            const startDay = 6; // মে ২০২৬ শুরু শনিবার থেকে
            
            for (let i = 0; i < 6; i++) { // ৫-৬টি সপ্তাহ
                let row = document.createElement('tr');
                for (let j = 0; j < 7; j++) {
                    let cell = document.createElement('td');
                    if (i === 0 && j < startDay) {
                        cell.innerHTML = "";
                    } else if (date > 31) {
                        cell.innerHTML = "";
                    } else {
                        const isFriday = (j === 6);
                        const arbDate = date + 13 + adjustment; // হিজরি ক্যালকুলেশন
                        const bngDate = (date + 17) % 31 || 31;
                        
                        cell.className = isFriday ? "bg-yellow-50" : "";
                        cell.innerHTML = `
                            <div class="hijri-main">${toBn(arbDate)}</div>
                            <div class="sub-dates">
                                <span>${date} May</span> | <span>${toBn(bngDate)} বৈশাখ</span>
                            </div>
                        `;
                        date++;
                    }
                    row.appendChild(cell);
                }
                body.appendChild(row);
                if (date > 31) break;
            }
        }
    </script>
</body>
</html>
