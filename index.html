<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট ক্যালেন্ডার - ইংরেজি ও আরবি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .eng-date { font-size: 1.2rem; font-weight: bold; color: #1e293b; }
        .arb-date { font-size: 0.75rem; color: #d97706; font-weight: 500; }
    </style>
</head>
<body class="bg-gray-50 p-2">

    <div class="max-w-md mx-auto space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
            <h1 class="text-xl font-bold text-blue-600 mb-1">আজকের তারিখ</h1>
            <div id="todayDisplay" class="text-gray-700"></div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-md border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full">❮</button>
                <h2 id="mLabel" class="font-bold text-lg"></h2>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full">❯</button>
            </div>
            
            <div class="grid grid-cols-7 gap-1 text-center font-bold text-gray-400 text-sm mb-2">
                <div>শনি</div><div>রবি</div><div>সোম</div><div>মঙ্গল</div><div>বুধ</div><div>বৃহ</div><div>শুক্র</div>
            </div>
            <div id="calGrid" class="grid grid-cols-7 gap-2"></div>
        </div>
    </div>

    <script>
        let curM = new Date().getMonth(), curY = new Date().getFullYear();

        function getArabicDate(date) {
            // আরবি মাসের নামসহ তারিখ বের করার জন্য Intl API
            return new Intl.DateTimeFormat('bn-BD-u-ca-islamic-uma', {day:'numeric', month:'long'}).format(date);
        }

        function render() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            const daysInMonth = new Date(curY, curM + 1, 0).getDate();
            const firstDay = new Date(curY, curM, 1).getDay();
            const startPadding = (firstDay + 1) % 7; 

            document.getElementById('mLabel').innerText = new Intl.DateTimeFormat('bn-BD', {month:'long', year:'numeric'}).format(new Date(curY, curM));

            for(let i=0; i<startPadding; i++) grid.innerHTML += '<div></div>';

            for(let d=1; d<=daysInMonth; d++) {
                const dateObj = new Date(curY, curM, d);
                const arabicFull = getArabicDate(dateObj);
                const isToday = d === new Date().getDate() && curM === new Date().getMonth() && curY === new Date().getFullYear();
                
                grid.innerHTML += `
                    <div class="p-2 rounded-xl border border-gray-50 text-center ${isToday ? 'bg-blue-50 ring-2 ring-blue-400' : 'bg-white shadow-sm'}">
                        <div class="eng-date">${d}</div>
                        <div class="arb-date">${arabicFull}</div>
                    </div>
                `;

                if(isToday) {
                    document.getElementById('todayDisplay').innerHTML = `
                        <p class="font-semibold text-lg">${new Intl.DateTimeFormat('bn-BD', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(dateObj)}</p>
                        <p class="text-amber-600 font-medium">আরবি: ${arabicFull}</p>
                    `;
                }
            }
        }

        function changeMonth(s) {
            curM += s;
            if(curM > 11) { curM = 0; curY++; }
            if(curM < 0) { curM = 11; curY--; }
            render();
        }
        render();
    </script>
</body>
</html>
