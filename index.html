<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; margin: 0; padding-bottom: 80px; }
        .main-card { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        
        /* Header & Clock */
        .header-section { background: linear-gradient(135deg, #059669 0%, #047857 100%); padding: 35px 20px 25px 20px; text-align: center; color: white; border-radius: 0 0 40px 40px; position: relative; }
        .clock-pill { background: rgba(255,255,255,0.15); display: inline-block; padding: 10px 30px; border-radius: 20px; font-size: 26px; margin-top: 10px; font-family: 'Poppins', sans-serif; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Footer Navigation */
        .footer-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background: white; display: flex; justify-content: space-around; align-items: center; padding: 12px 10px; border-top: 1px solid #f1f5f9; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; cursor: pointer; transition: 0.3s; width: 25%; }
        .nav-item.active { color: #059669; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; }
        .nav-item span { font-size: 11px; font-weight: 600; }

        /* Calendar Grid */
        .eng-num { font-family: 'Poppins', sans-serif; }
        .day-cell { height: 75px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #ffffff; border-radius: 18px; border: 1px solid #f1f5f9; cursor: pointer; position: relative; }
        .today-mark { background: #2563eb !important; color: white !important; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); }
        .friday-text { color: #ef4444 !important; font-weight: 700; }
        
        #detailModal, #adminModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-box { background: white; width: 100%; max-width: 380px; border-radius: 30px; padding: 30px; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header-section">
        <div class="absolute top-6 right-6 text-white text-2xl cursor-pointer opacity-70" onclick="openAdminPanel()">⋮</div>
        <h1 class="text-xs font-bold font-[Poppins] opacity-60 uppercase tracking-[0.2em]">My Smart Calendar</h1>
        <div id="liveTime" class="clock-pill">00:00:00 AM</div>
        <div class="w-full mt-4 overflow-hidden whitespace-nowrap text-sm text-emerald-100">
            <marquee id="scrollText">My Smart Calendar-এ আপনাকে স্বাগতম!</marquee>
        </div>
    </div>

    <div class="pt-8 pb-6 px-4 text-center" id="calendar-content">
        <h2 id="topDayName" class="text-3xl font-bold text-slate-800 mb-1">...</h2>
        <p id="topEng" class="text-lg font-semibold text-slate-400 mb-5 eng-num"></p>
        <div class="flex justify-center gap-3">
            <div class="bg-emerald-50 px-4 py-2 rounded-2xl border border-emerald-100"><p id="topHijri" class="text-emerald-700 font-bold text-sm"></p></div>
            <div class="bg-orange-50 px-4 py-2 rounded-2xl border border-orange-100"><p id="topBangla" class="text-orange-700 font-bold text-sm"></p></div>
        </div>
        
        <div class="flex justify-between items-center px-6 mt-8 mb-4">
            <button onclick="changeMonth(-1)" class="text-2xl text-slate-300 hover:text-emerald-600 transition">❮</button>
            <div id="monthDisplay" class="text-2xl font-bold text-slate-800 eng-num"></div>
            <button onclick="changeMonth(1)" class="text-2xl text-slate-300 hover:text-emerald-600 transition">❯</button>
        </div>

        <div class="grid grid-cols-7 gap-3 px-2 mb-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">
            <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-400">Fri</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-3 px-2 pb-12"></div>
    </div>

    <div id="other-content" class="p-10 text-center text-slate-500 hidden">
        <p>এই ফিচারটি শীঘ্রই আসছে...</p>
    </div>
</div>

<div class="footer-nav">
    <div class="nav-item active" onclick="switchTab('calendar', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span>Calendar</span>
    </div>
    <div class="nav-item" onclick="switchTab('age', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <span>Age Calc</span>
    </div>
    <div class="nav-item" onclick="switchTab('holiday', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        <span>Holiday</span>
    </div>
    <div class="nav-item" onclick="switchTab('profile', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Profile</span>
    </div>
</div>

<div id="adminModal"><div class="modal-box"><h2 class="text-xl font-bold mb-4">অ্যাডমিন প্যানেল</h2><textarea id="adminMsgInput" class="w-full border p-3 rounded-xl mb-4 h-20" placeholder="মেসেজ দিন..."></textarea><div class="flex gap-2"><button onclick="saveAdminMsg()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl">সেভ</button><button onclick="closeAdminPanel()" class="flex-1 bg-gray-100 py-3 rounded-xl">বন্ধ</button></div></div></div>

<script>
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    function switchTab(tab, el) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        
        const content = document.getElementById('calendar-content');
        const other = document.getElementById('other-content');
        
        if(tab === 'calendar') {
            content.classList.remove('hidden');
            other.classList.add('hidden');
        } else {
            content.classList.add('hidden');
            other.classList.remove('hidden');
            other.innerHTML = `<div class="py-20"><p class="text-2xl font-bold text-emerald-600">${tab.toUpperCase()}</p><p>এই বিভাগটি খুব শীঘ্রই যোগ করা হবে।</p></div>`;
        }
    }

    function openAdminPanel() {
        if(prompt("পাসওয়ার্ড দিন:") === "1212") document.getElementById('adminModal').style.display = 'flex';
        else alert("ভুল পাসওয়ার্ড!");
    }
    function closeAdminPanel() { document.getElementById('adminModal').style.display = 'none'; }
    function saveAdminMsg() {
        const msg = document.getElementById('adminMsgInput').value;
        if(msg) document.getElementById('scrollText').innerText = msg;
        closeAdminPanel();
    }

    const hijriMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const banglaMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];
    const engMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dayNamesBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        const realToday = new Date();
        grid.innerHTML = '';
        document.getElementById('monthDisplay').innerText = `${engMonths[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const startPos = (firstDay + 1) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startPos; i++) grid.innerHTML += '<div></div>';

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const isToday = (dateObj.toDateString() === realToday.toDateString());
            
            let diffDays = Math.floor((dateObj - new Date(2026, 4, 3)) / 86400000);
            let hDate = ((diffDays + 14) % 29 + 29) % 29 || 29;
            let hM = (Math.floor((diffDays + 14) / 29) % 12 + 12) % 12;

            let bDiff = Math.floor((dateObj - new Date(2026, 3, 14)) / 86400000) + 1;
            let bMonthIdx = 0, bDate = bDiff;
            const bLens = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; 
            while(bMonthIdx < 12 && bDate > bLens[bMonthIdx]) { bDate -= bLens[bMonthIdx]; bMonthIdx++; }

            grid.innerHTML += `
                <div class="day-cell ${isToday ? 'today-mark' : ''}">
                    <div class="text-xl font-bold eng-num ${dateObj.getDay() === 5 && !isToday ? 'friday-text' : ''}">${day}</div>
                    <div class="text-[10px] font-bold opacity-50 eng-num">${hDate}/${bDate}</div>
                </div>
            `;

            if(isToday) {
                document.getElementById('topDayName').innerText = `আজ ${dayNamesBn[dateObj.getDay()]}`;
                document.getElementById('topEng').innerText = `${day} ${engMonths[month]} ${year} AD`;
                document.getElementById('topHijri').innerText = `🌙 ${hDate} ${hijriMonths[hM]} 1447`;
                document.getElementById('topBangla').innerText = `🌾 ${bDate} ${banglaMonths[bMonthIdx]} 1433`;
            }
        }
    }

    function changeMonth(s) { currentMonth += s; if(currentMonth>11){currentMonth=0;currentYear++;} else if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(currentYear, currentMonth); }
    
    setInterval(() => {
        document.getElementById('liveTime').innerText = new Date().toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }, 1000);

    renderCalendar(currentYear, currentMonth);
</script>
</body>
</html>
