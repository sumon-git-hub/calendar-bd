<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .header-section { background-color: #059669; padding: 20px; text-align: center; color: white; border-radius: 0 0 20px 20px; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 10px; }
        .day-cell { height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; border-radius: 8px; border: 1px solid #eee; }
        .today { background: #2563eb !important; color: white !important; }
    </style>
</head>
<body>

    <div class="max-w-[450px] mx-auto bg-white min-h-screen shadow-lg">
        <div class="header-section">
            <h1 class="text-xl font-bold">My Smart Calendar</h1>
            <div id="clock" class="text-2xl font-bold mt-2">00:00:00 PM</div>
        </div>

        <div class="p-6 text-center">
            <h2 id="topDay" class="text-2xl font-bold text-emerald-800">লোড হচ্ছে...</h2>
            <div id="topEng" class="text-lg mt-1 text-gray-600"></div>
            <div id="topHij" class="text-lg mt-1 text-gray-600"></div>
            <div id="topBan" class="text-lg mt-1 text-gray-600"></div>
        </div>

        <div class="flex justify-between items-center px-10 py-4">
            <button onclick="changeMonth(-1)" class="text-2xl">❮</button>
            <div id="monthLabel" class="text-xl font-bold"></div>
            <button onclick="changeMonth(1)" class="text-2xl">❯</button>
        </div>

        <div class="grid-7 text-xs font-bold text-gray-400 text-center">
            <div>SAT</div><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div class="text-red-500">FRI</div>
        </div>
        <div id="calendarGrid" class="grid-7"></div>
    </div>

    <script>
        // আপনার Firebase URL টি এখানে নিশ্চিত করুন
        const firebaseConfig = { databaseURL: "https://YOUR_DATABASE_URL.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let curYear = 2026, curMonth = 4, hAdj = 0;

        const hMonths = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
        const bMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
        const eMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const bDays = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

        db.ref('hijriAdj').on('value', (s) => {
            hAdj = s.val() || 0;
            render();
        });

        function render() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            document.getElementById('monthLabel').innerText = `${eMonths[curMonth]} ${curYear}`;

            const first = new Date(curYear, curMonth, 1).getDay();
            const start = (first + 1) % 7;
            const daysInM = new Date(curYear, curMonth + 1, 0).getDate();

            for (let i = 0; i < start; i++) grid.innerHTML += '<div></div>';

            const base = new Date(2026, 4, 3); // বেস তারিখ ৩ মে

            for (let d = 1; d <= daysInM; d++) {
                const date = new Date(curYear, curMonth, d);
                const diff = Math.round((date - base) / 86400000);
                
                // হিজরি ২৯ দিনের ফিক্সড সাইকেল
                let hD = ((diff + 14) % 29 + 29) % 29;
                if(hD === 0) hD = 29;
                let hM = (Math.floor((diff + 14) / 29) % 12 + 12) % 12;

                // আপনার শর্ত: ১ তারিখকে ৩০ বানানো
                if (hAdj > 0 && hD === 1) { hD = 30; hM = (hM - 1 + 12) % 12; }

                // বাংলা ক্যালকুলেশন
                let bTotal = Math.round((date - new Date(2026, 3, 14)) / 86400000) + 1;
                let bM = 0, bD = bTotal, bLens = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30];
                for(let j=0; j<12; j++){ if(bD <= bLens[j]){ bM = j; break; } bD -= bLens[j]; }

                const isT = (date.toDateString() === new Date().toDateString());
                grid.innerHTML += `<div class="day-cell ${isT?'today':''}">
                    <div class="font-bold text-lg">${d}</div>
                    <div class="text-[10px]">${hD}/${bD}</div>
                </div>`;

                if(isT) {
                    document.getElementById('topDay').innerText = `আজ ${bDays[date.getDay()]}`;
                    document.getElementById('topEng').innerText = `${d} ${eMonths[curMonth]} ${curYear} AD`;
                    document.getElementById('topHij').innerText = `${hD} ${hMonths[hM]} 1447 হিজরি`;
                    document.getElementById('topBan').innerText = `${bD} ${bMonths[bM]} 1433 বঙ্গাব্দ`;
                }
            }
        }

        function changeMonth(v) { curMonth += v; if(curMonth>11){curMonth=0;curYear++;} else if(curMonth<0){curMonth=11;curYear--;} render(); }
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US'); }, 1000);
    </script>
</body>
</html>
