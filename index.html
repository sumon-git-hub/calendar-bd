<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিডি ক্যালেন্ডার ও স্মার্ট নোট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .day-card:hover { transform: scale(1.02); cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body class="p-2 md:p-6 text-gray-800">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="bg-green-600 text-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold italic">স্মার্ট ক্যালেন্ডার ও নোট</h1>
                <p class="text-xs opacity-90">বাংলা, ইংরেজি ও হিজরি তারিখ</p>
            </div>
            <div id="liveClock" class="text-lg font-bold bg-white/20 px-3 py-1 rounded-lg border border-white/30"></div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-bold mb-3">📅 বয়স ক্যালকুলেটর</h2>
                    <input type="date" id="dob" class="w-full border p-2 rounded-lg mb-3 outline-none focus:ring-2 focus:ring-blue-400">
                    <button onclick="calculateAge()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700">হিসাব করুন</button>
                    <div id="ageResult" class="mt-3"></div>
                </div>

                <div class="bg-gray-800 p-5 rounded-2xl shadow-md text-white">
                    <h2 class="text-lg font-bold mb-2 text-yellow-400">হিজরি সমন্বয়</h2>
                    <div class="flex items-center justify-between bg-white/10 p-2 rounded-xl">
                        <button onclick="adjustHijri(-1)" class="w-10 h-10 bg-red-500 rounded-full font-bold">-১</button>
                        <span id="offsetVal" class="text-xl font-bold">০</span>
                        <button onclick="adjustHijri(1)" class="w-10 h-10 bg-green-500 rounded-full font-bold">+১</button>
                    </div>
                </div>

                <div id="noteBox" class="bg-yellow-50 p-5 rounded-2xl shadow-sm border border-yellow-200 hidden">
                    <h2 class="text-lg font-bold mb-2 text-yellow-800">📝 নোট: <span id="selectedDateLabel"></span></h2>
                    <textarea id="noteInput" class="w-full h-24 border border-yellow-300 rounded-lg p-2 bg-white outline-none focus:ring-2 focus:ring-yellow-400" placeholder="এখানে কিছু লিখুন..."></textarea>
                    <div class="flex gap-2 mt-3">
                        <button onclick="saveNote()" class="flex-1 bg-yellow-600 text-white py-2 rounded-lg font-bold hover:bg-yellow-700">সেভ করুন</button>
                        <button onclick="closeNote()" class="flex-1 bg-gray-400 text-white py-2 rounded-lg font-bold hover:bg-gray-500 text-sm">বন্ধ করুন</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 border rounded-full hover:bg-gray-100">❮</button>
                    <h2 id="monthDisplay" class="text-2xl font-bold">মে ২০২৬</h2>
                    <button onclick="changeMonth(1)" class="p-2 border rounded-full hover:bg-gray-100">❯</button>
                </div>
                
                <div class="grid grid-cols-7 gap-2 text-center font-bold text-gray-500 text-xs md:text-sm mb-4">
                    <div>শনি</div><div>রবি</div><div>সোম</div><div>মঙ্গল</div><div>বুধ</div><div>বৃহঃ</div><div>শুক্র</div>
                </div>
                
                <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        let currentYear = 2026;
        let currentMonth = 4;
        let hijriOffset = parseInt(localStorage.getItem('hijriOffset')) || 0;
        let selectedDateKey = "";

        const enMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('offsetVal').innerText = hijriOffset;

        function updateTime() {
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('bn-BD');
        }
        setInterval(updateTime, 1000);
        updateTime();

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthLabel = document.getElementById('monthDisplay');
            grid.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            let startOffset = (firstDay + 1) % 7; 

            monthLabel.innerText = `${enMonths[currentMonth]} ${currentYear}`;

            for (let i = 0; i < startOffset; i++) grid.innerHTML += `<div></div>`;

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(currentYear, currentMonth, day);
                const dateKey = `${currentYear}-${currentMonth}-${day}`;
                
                // Hijri & Bangla (Rough Approx)
                let hDay = (parseInt(new Intl.DateTimeFormat('en-u-ca-islamic-uma-nu-latn', {day:'numeric'}).format(dateObj)) + hijriOffset) % 30 || 30;
                let bDay = (day + 15) % 30 || 30;

                const hasNote = localStorage.getItem('note_' + dateKey);
                const isToday = new Date().toDateString() === dateObj.toDateString();

                grid.innerHTML += `
                    <div onclick="openNote('${dateKey}', '${day} ${enMonths[currentMonth]}')" class="day-card h-16 md:h-20 border rounded-xl p-1 flex flex-col justify-between ${isToday ? 'bg-blue-600 text-white shadow-lg' : 'bg-white'} ${hasNote ? 'border-yellow-400 border-2 shadow-inner' : 'border-gray-100'}">
                        <div class="flex justify-between items-center px-1">
                            <span class="font-bold text-base md:text-xl">${day}</span>
                            ${hasNote ? '<span class="text-[10px]">📌</span>' : ''}
                        </div>
                        <div class="flex justify-between text-[8px] md:text-[10px] px-1 font-semibold">
                            <span class="${isToday ? 'text-blue-100' : 'text-green-600'}">${bDay}</span>
                            <span class="${isToday ? 'text-blue-100' : 'text-red-500'}">${hDay}</span>
                        </div>
                    </div>
                `;
            }
        }

        function openNote(key, label) {
            selectedDateKey = key;
            document.getElementById('selectedDateLabel').innerText = label;
            document.getElementById('noteInput').value = localStorage.getItem('note_' + key) || "";
            document.getElementById('noteBox').classList.remove('hidden');
        }

        function saveNote() {
            const text = document.getElementById('noteInput').value;
            if (text.trim() === "") {
                localStorage.removeItem('note_' + selectedDateKey);
            } else {
                localStorage.setItem('note_' + selectedDateKey, text);
            }
            renderCalendar();
            closeNote();
        }

        function closeNote() {
            document.getElementById('noteBox').classList.add('hidden');
        }

        function changeMonth(step) {
            currentMonth += step;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function adjustHijri(val) {
            hijriOffset += val;
            localStorage.setItem('hijriOffset', hijriOffset);
            document.getElementById('offsetVal').innerText = hijriOffset;
            renderCalendar();
        }

        function calculateAge() {
            const dob = new Date(document.getElementById('dob').value);
            if (isNaN(dob)) return;
            const now = new Date();
            let y = now.getFullYear() - dob.getFullYear(), m = now.getMonth() - dob.getMonth(), d = now.getDate() - dob.getDate();
            if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
            if (m < 0) { y--; m += 12; }
            document.getElementById('ageResult').innerHTML = `<p class="bg-blue-50 p-3 rounded text-blue-800 font-bold text-sm">${y} বছর, ${m} মাস, ${d} দিন</p>`;
        }

        renderCalendar();
    </script>
</body>
</html>
