<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f1f5f9; margin: 0; padding-bottom: 100px; }
        .app-container { max-width: 450px; margin: 0 auto; background: #ffffff; min-height: 100vh; position: relative; overflow: hidden; }
        
        /* Glassy Header */
        .glass-header { background: linear-gradient(135deg, #059669 0%, #047857 100%); padding: 40px 20px 30px; text-align: center; color: white; border-radius: 0 0 45px 45px; position: relative; box-shadow: 0 10px 30px rgba(5, 150, 105, 0.2); }
        .clock-display { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 700; margin: 10px 0; letter-spacing: -1px; }
        .marquee-strip { background: rgba(0,0,0,0.1); padding: 5px 0; font-size: 13px; color: #d1fae5; margin-top: 15px; border-radius: 50px; }

        /* Navigation Footer */
        .nav-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 15px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.5); z-index: 1000; }
        .nav-btn { color: #94a3b8; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: #059669; transform: translateY(-5px); }
        .nav-btn span { font-size: 10px; font-weight: 700; text-transform: uppercase; }

        /* Calendar Grid */
        .eng-num { font-family: 'Poppins', sans-serif; }
        .calendar-grid { display: grid; grid-cols: 7; gap: 10px; padding: 0 20px; }
        .day-box { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 18px; background: #f8fafc; border: 1px solid #f1f5f9; cursor: pointer; transition: 0.2s; }
        .today { background: #2563eb !important; color: white !important; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); border: none; }
        
        /* Tab Transitions */
        .tab-pane { display: none; animation: slideUp 0.4s ease-out; }
        .tab-pane.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Input */
        .custom-input { width: 100%; padding: 15px; border-radius: 20px; border: 2px solid #f1f5f9; background: #f8fafc; font-weight: 600; outline: none; transition: 0.3s; }
        .custom-input:focus { border-color: #059669; background: #fff; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="glass-header">
        <div class="absolute top-8 right-8 cursor-pointer opacity-80" onclick="openAdmin()">
            <svg width="24" height="24" fill="white" viewBox="0 0 16 16"><path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>
        </div>
        <p class="text-[10px] uppercase tracking-[0.4em] opacity-60 font-bold">Smart Calendar</p>
        <div id="clock" class="clock-display">00:00:00</div>
        <div class="marquee-strip">
            <marquee id="scrollTxt" scrollamount="5">স্বাগতম সুমন ভাই!</marquee>
        </div>
    </div>

    <main class="mt-8">
        
        <section id="cal-tab" class="tab-pane active">
            <div class="text-center px-6 mb-8">
                <h2 id="bnDay" class="text-3xl font-bold text-slate-800">...</h2>
                <div class="flex justify-center gap-2 mt-4">
                    <span id="hjDate" class="bg-emerald-50 text-emerald-700 px-4 py-1.5 rounded-full text-xs font-bold border border-emerald-100"></span>
                    <span id="bnDate" class="bg-orange-50 text-orange-700 px-4 py-1.5 rounded-full text-xs font-bold border border-orange-100"></span>
                </div>
            </div>

            <div class="flex justify-between items-center px-10 mb-6">
                <button onclick="moveMonth(-1)" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400">❮</button>
                <div id="mTitle" class="text-xl font-bold text-slate-700 eng-num uppercase tracking-widest"></div>
                <button onclick="moveMonth(1)" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400">❯</button>
            </div>

            <div class="grid grid-cols-7 gap-3 px-6 mb-4 text-center text-[10px] font-bold text-slate-300 uppercase">
                <div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div class="text-red-400">Fri</div>
            </div>
            <div id="calGrid" class="grid grid-cols-7 gap-3 px-6 pb-20"></div>
        </section>

        <section id="age-tab" class="tab-pane px-8">
            <h3 class="text-2xl font-bold text-slate-800 mb-2">বয়স হিসাব</h3>
            <p class="text-slate-400 text-sm mb-8">আপনার জন্মতারিখ দিন</p>
            <input type="date" id="bday" class="custom-input mb-4 eng-num">
            <button onclick="getAge()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-100 active:scale-95 transition">হিসাব করুন</button>
            <div id="ageRes" class="hidden mt-10 p-8 bg-slate-900 rounded-[35px] text-center text-white">
                <p class="opacity-60 text-xs uppercase tracking-widest mb-2">আপনার বর্তমান বয়স</p>
                <div id="ageVal" class="text-2xl font-bold"></div>
            </div>
        </section>

        <section id="hol-tab" class="tab-pane px-8">
            <h3 class="text-2xl font-bold text-slate-800 mb-6">ছুটির তালিকা ২০২৬</h3>
            <div class="space-y-4" id="holidayList">
                </div>
        </section>

        <section id="pro-tab" class="tab-pane px-8 text-center">
            <div class="w-28 h-28 bg-emerald-50 rounded-full mx-auto flex items-center justify-center text-emerald-600 text-4xl font-bold border-4 border-white shadow-xl mb-6">S</div>
            <h2 id="pName" class="text-2xl font-bold text-slate-800">সুমন ভাই</h2>
            <div class="mt-10 text-left">
                <label class="text-xs font-bold text-slate-400 uppercase ml-2">নাম পরিবর্তন</label>
                <input type="text" id="nameInp" class="custom-input mt-2" placeholder="আপনার নাম...">
                <button onclick="updateProfile()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold mt-4">আপডেট</button>
            </div>
        </section>

    </main>

    <nav class="nav-dock">
        <div class="nav-btn active" onclick="switchTab('cal', this)">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span>ক্যালেন্ডার</span>
        </div>
        <div class="nav-btn" onclick="switchTab('age', this)">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            <span>বয়স</span>
        </div>
        <div class="nav-btn" onclick="switchTab('hol', this)">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
            <span>ছুটি</span>
        </div>
        <div class="nav-btn" onclick="switchTab('pro', this)">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span>প্রোফাইল</span>
        </div>
    </nav>
</div>

<div id="admMod" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md z-[2000] flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-sm rounded-[40px] p-8">
        <h2 class="text-xl font-bold mb-6 text-slate-800">মেসেজ সেটিংস</h2>
        <textarea id="msgBox" class="w-full bg-slate-50 border-none rounded-3xl p-5 h-32 outline-none focus:ring-2 focus:ring-emerald-500 mb-6" placeholder="নতুন মেসেজ..."></textarea>
        <div class="flex gap-4">
            <button onclick="saveMsg()" class="flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-bold">সেভ</button>
            <button onclick="closeAdmin()" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold">বন্ধ</button>
        </div>
    </div>
</div>

<script>
    let curY = new Date().getFullYear();
    let curM = new Date().getMonth();

    // Tab Switcher
    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId + '-tab').classList.add('active');
        el.classList.add('active');
    }

    // Age Calc
    function getAge() {
        const b = document.getElementById('bday').value;
        if(!b) return;
        const bd = new Date(b), n = new Date();
        let y = n.getFullYear() - bd.getFullYear(), m = n.getMonth() - bd.getMonth(), d = n.getDate() - bd.getDate();
        if(d < 0) { m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
        if(m < 0) { y--; m += 12; }
        document.getElementById('ageRes').classList.remove('hidden');
        document.getElementById('ageVal').innerText = `${y} বছর, ${m} মাস, ${d} দিন`;
    }

    // Calendar
    const bnMs = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফালগুন", "চৈত্র"];
    const hjMs = ["যিলক্বদ", "যিলহজ্ব", "মুহাররম", "সফর", "রবিউল আউয়াল", "রবিউস সানি", "জমাদিউল আউয়াল", "জমাদিউস সানি", "রজব", "শাবান", "রমজান", "শাওয়াল"];
    const enMs = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const daysBn = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function renderCal(y, m) {
        const g = document.getElementById('calGrid');
        const today = new Date();
        g.innerHTML = '';
        document.getElementById('mTitle').innerText = `${enMs[m]} ${y}`;

        const first = new Date(y, m, 1).getDay();
        const offset = (first + 1) % 7;
        const total = new Date(y, m + 1, 0).getDate();

        for(let i=0; i<offset; i++) g.innerHTML += '<div></div>';

        for(let d=1; d<=total; d++) {
            const dt = new Date(y, m, d);
            const isT = (dt.toDateString() === today.toDateString());
            
            let diff = Math.floor((dt - new Date(2026, 4, 3)) / 86400000);
            let hD = ((diff + 14) % 29 + 29) % 29 || 29;
            let hM = (Math.floor((diff + 14) / 29) % 12 + 12) % 12;

            let bDiff = Math.floor((dt - new Date(2026, 3, 14)) / 86400000) + 1;
            let bMi = 0, bD = bDiff;
            const bL = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30]; 
            while(bMi < 12 && bD > bL[bMi]) { bD -= bL[bMi]; bMi++; }

            g.innerHTML += `
                <div class="day-box ${isT ? 'today' : ''}">
                    <span class="text-lg font-bold eng-num ${dt.getDay()===5 && !isT ? 'text-red-500':''}">${d}</span>
                    <span class="text-[9px] opacity-50 font-bold eng-num">${hD}/${bD}</span>
                </div>
            `;

            if(isT) {
                document.getElementById('bnDay').innerText = `আজ ${daysBn[dt.getDay()]}`;
                document.getElementById('hjDate').innerText = `🌙 ${hD} ${hjMs[hM]} 1447`;
                document.getElementById('bnDate').innerText = `🌾 ${bD} ${bnMs[bMi]} 1433`;
            }
        }
    }

    function moveMonth(s) { curM += s; if(curM>11){curM=0;curY++;} else if(curM<0){curM=11;curY--;} renderCal(curY, curM); }

    // Admin & Profile
    function openAdmin() { if(prompt("Pass:")==="1212") document.getElementById('admMod').classList.remove('hidden'); }
    function closeAdmin() { document.getElementById('admMod').classList.add('hidden'); }
    function saveMsg() { 
        const m = document.getElementById('msgBox').value;
        if(m) { document.getElementById('scrollTxt').innerText = m; localStorage.setItem('msg', m); }
        closeAdmin();
    }
    function updateProfile() {
        const n = document.getElementById('nameInp').value;
        if(n) { document.getElementById('pName').innerText = n; localStorage.setItem('uname', n); alert("আপডেট সফল!"); }
    }

    // Holiday List Injection
    const hols = [
        {n: "শহীদ দিবস", d: "২১ ফেব্রুয়ারি", t: "সরকারি"},
        {n: "স্বাধীনতা দিবস", d: "২৬ মার্চ", t: "সরকারি"},
        {n: "ঈদুল ফিতর", d: "২০-২২ মার্চ", t: "উৎসব"},
        {n: "পহেলা বৈশাখ", d: "১৪ এপ্রিল", t: "সরকারি"},
        {n: "মে দিবস", d: "১ মে", t: "সরকারি"}
    ];
    const hDiv = document.getElementById('holidayList');
    hols.forEach(h => {
        hDiv.innerHTML += `
            <div class="bg-white p-5 rounded-3xl border border-slate-100 flex justify-between items-center shadow-sm">
                <div><p class="font-bold text-slate-800">${h.n}</p><p class="text-xs text-slate-400 eng-num">${h.d}</p></div>
                <span class="bg-emerald-50 text-emerald-600 px-4 py-1 rounded-full text-[10px] font-bold uppercase">${h.t}</span>
            </div>
        `;
    });

    // Init
    const sn = localStorage.getItem('uname'), sm = localStorage.getItem('msg');
    if(sn) document.getElementById('pName').innerText = sn;
    if(sm) document.getElementById('scrollTxt').innerText = sm;

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
    }, 1000);

    renderCal(curY, curM);
</script>
</body>
</html>
